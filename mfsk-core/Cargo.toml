[package]
name        = "mfsk-core"
version.workspace = true
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-or-later"
description = "Pure-Rust WSJT-family decoders + synthesisers (FT8 FT4 FST4 WSPR JT9 JT65 Q65) behind a zero-cost Protocol trait. Host (rustfft) or no_std embedded (ESP32-S3, RP2350, Cortex-M) via a pluggable FFT backend; fixed-point hot path for FPU-less MCUs. Ships with embedded-poc/m5stack-s3-app, a working M5StickS3 FT8 controller (LCD UI, BLE CI-V to IC-705, acoustic mic, QSO FSM) decoding real on-air signals in ~1.2 s post-SlotEnd on Xtensa LX7."
repository  = "https://github.com/jl1nie/mfsk-core"
readme      = "../README.md"
keywords    = ["wsjtx", "ft8", "wspr", "q65", "amateur-radio"]
categories  = ["science", "encoding", "multimedia::audio", "embedded", "no-std"]

[features]
default      = ["std", "ft8", "ft4", "parallel", "fft-rustfft"]

# Standard-library availability. Pulls in `rustfft` (std-only) and
# enables the rayon-based parallel iterators; required for every
# protocol's wide-band decode path because `rustfft::FftPlanner` is
# the default FFT backend. `no_std + alloc` builds turn this off and
# pick a no_std FFT implementation via the `fft-*` features below.
std          = ["alloc"]

# `no_std + alloc` baseline. All protocol modules that allocate
# (`Vec`, `Box`, `String`) need this; only purely-stack code can
# avoid it. The crate top-level enables `extern crate alloc` whenever
# this feature is on.
alloc        = []

# Aggregate features.
full         = ["std", "fft-rustfft", "ft8", "ft4", "fst4", "wspr", "jt9", "jt65", "q65", "msk144", "packet-bytes", "uvpacket", "parallel", "serde"]

# Optional derive of `serde::{Serialize, Deserialize}` on the host-facing
# `msg::decoded::Decoded` UI row and `engine::protocol::ProtocolId`. Off by
# default; purely additive (no behavioural change to any decode path). Folded
# into `full` so the published docs show the impls and CI exercises the
# round-trip.
serde        = ["dep:serde"]

# FFT backend selection. `mfsk_core::engine::fft::FftPlanner` is the
# trait every decode-side caller talks to; one of these features must
# be on whenever decode-side code is compiled (host gets rustfft;
# embedded targets bring their own backend through the extern Rust
# factory `mfsk_core_make_default_fft_planner` — see engine::fft docs).
#
# `fft-rustfft` also pulls `realfft`, a real-input wrapper over the same
# `rustfft` (same numerics, same resolved version via Cargo's unifier),
# as the host override of `FftPlanner::plan_real_forward` (#390). JT9's
# `softsym::AudioFft::build` runs one 653,184-point FFT per scan on
# real-valued audio; as a complex-to-complex transform it was ~57% of
# `decode_scan`'s wall time (measured, `jt9::tests::phase_breakdown_diag`),
# and a real-input FFT does about half that work.
fft-rustfft  = ["std", "dep:rustfft", "dep:realfft"]
fft-extern   = ["alloc"]

# Caller-provided real f32 dot-product backend for the DSP hot loops
# (`engine::dsp::dotprod`). Same extern-hook shape as `fft-extern`: the
# binary defines `mfsk_core_dotprod_f32`. Exists for embedded builds
# that can route it to esp-dsp -- measured 3.6-9.2x over the portable
# loop on ESP32-S3 (issue #307). Host builds have no reason to enable
# it; without it the portable implementation is used.
dotprod-extern = []

# Embedded integer pipeline: u16 spectrogram + i16 internal DFT +
# Q11i16 LLR + integer NMS BP. Off by default — host stays
# bit-identical to the existing f32 path. Embedded targets turn this
# on for halved PSRAM bandwidth and ~12 KB BP scratch (vs the f32
# default).
#
# LLR-format history: 0.5.x used Q3i8 (i8, ±16, ~1/8 LSB, ~6 KB BP
# scratch). A brief 2026-05-04 cleanup read host sweeps as Q3i8 ≈
# Q11i16 equivalent, but the wider LX7 sweep in 0.6.3
# (`mfsk-core/src/ft8/decode_block/process_candidates.rs` doc comment)
# showed Q3i8's quantization step was the recall ceiling on Xtensa:
# host fixed-point + rustfft hit 16/18 on `qso3_busy.wav` with f32
# but only 9/18 with Q3i8. The active hot-loop type has been Q11i16
# (i16, ±16, ~1/2048 LSB, ~12 KB BP scratch) since the LlrScalar
# trait unification in `a6425ee` (2026-05-02, shipped 0.6.2). Q3i8
# stays in `engine::scalar` for the comparison path.
#
# **`fixed-point` implies `nstep-half`** (Phase 1.7.7b, 2026-05-17).
# The two were independent features for historical reasons but are
# always co-enabled on every embedded target — and host fixed-point
# builds *must* use the same NSTEP if they want to simulate embedded
# faithfully. Decoupling them silently gave host fixed-point a
# different time-grid (NSTEP=NSPS/4 vs embedded NSPS/2) and made
# `decode_block_into` produce a completely different spec /
# coarse_sync ranking / pass1 candidates from S3 wav_sim (e.g. 4 vs 7
# decodes on qso3_busy single-pass). Coupling them removes the trap.
fixed-point  = ["nstep-half"]

# The LLR/BP hot loop in `Q11i16` rather than `f32` — **opt-in, and
# `fixed-point` no longer implies it** (issue #349, 2026-09-01).
#
# It was implied, on the assumption that an integer BP is faster on a
# board. Measured on a CoreS3 (LX7, the target this exists for), it is
# not: same LLRs, same `max_iter`, same binary, BP runs **22 813 us in
# Q11i16 against 19 455 in f32 — 0.85x, i.e. 18 % slower**. The LX7 has
# an f32 FPU; i16 check-node arithmetic saves no cycles and pays for
# the saturating helpers. #198 recorded the same for FST4 and FT4,
# which is why neither adopted `fixed-point` — FT8's own BP had never
# been checked.
#
# What `fixed-point` still buys is memory, and that is the spectrogram
# (`SpecCell = u16`, 702 -> 351 KB), not this. So the two are now
# separate: turn this on to get the i16 BP scratch (~12 KB against
# ~24 KB in f32) if a target is that tight, and leave it off
# otherwise.
fixed-point-llr = ["fixed-point"]

# Halve coarse_sync time-axis resolution (NSTEP = NSPS/2 instead of
# NSPS/4 = WSJT-X reference). Embedded targets enable this — at NSPS/4
# the spec memory and stage-1 FFT count both double, which exceeds
# the LX7 post-SlotEnd budget. NSPS/2 was the embedded baseline up
# through 0.5.4 and is what `embedded-shared/stage1_inc` already
# emits. Host f32 path stays on the WSJT-faithful NSPS/4 default;
# host fixed-point inherits this via the `fixed-point` -> `nstep-half`
# dep so it can simulate embedded byte-for-byte.
nstep-half   = []

# Always-on coarse_sync sub-stage profiling. Emits `[coarse_sync prof]`
# breakdown (allsum / score / dedupe+sort / total μs) to stderr after
# every `coarse_sync` call. Only useful when investigating stage-2
# wall-clock — adds 4 timestamp reads per call, negligible cost. Off by
# default; automatically disabled on `wasm32-unknown-unknown` at compile
# time to prevent runtime panics (`Instant::now` is unimplemented).
profile-coarse = ["std"]

# Lightweight modes — embedded-port-clean. `fft-rustfft` (host) or
# `fft-extern` (embedded) is required at the crate level for the
# decode pipeline; the protocol features themselves only enable the
# protocol-specific glue.
ft8          = []
ft4          = []
wspr         = []
packet-bytes = []

# WSPR pass-2 candidate-ladder truncation (issue #260 Phase 2). Off by
# default — host stays wsprd-faithful: the full Fano + DT-peak-up +
# OSD ladder runs on every candidate that clears `minsync2`, matching
# `wsprd.c` exactly. Embedded targets turn this on (see
# `embedded-shared`'s `wspr-bench` feature) to rank pass-2 candidates
# by refined sync and run that ladder only on the top
# `PASS2_DEEP_LADDER_TOP_N` — see `wspr::decode::decode_pass2_top_n`'s
# doc comment for the AWGN-sweep evidence this is bounded by. To
# exercise this path on host (e.g. before flashing, mirroring how
# `fixed-point` lets host simulate embedded's numeric path), add it to
# an explicit `--features` list; it is not part of `full`.
wspr-pass2-topn = []

# WSPR Fano cycle-budget: trade floor sensitivity for wall-clock
# (issue #260). Off by default — host gets `WSPR_FANO_CYCLE_BUDGET =
# 10_000` cycles/bit, which is `wsprd.c:799`'s own `maxcycles` and
# therefore neither slower nor less faithful than the reference
# decoder. Embedded targets turn this on (see `embedded-shared`'s
# `wspr-bench` feature) to drop to 5_000, which is what keeps a CoreS3
# `decode_scan` inside WSPR's 120 s slot; it costs floor recall
# (-32 dB 22 % -> 19 %) and stays phantom-free.
#
# **Not a free knob upward.** Raising the budget past the reference
# buys floor recall and then starts manufacturing decodes: on the
# 500-trial AWGN corpus phantoms appear between 20_000 and 50_000, and
# by 500_000 the golden file emits four and recall drops below the
# capped value. See `wspr::decode`'s `WSPR_FANO_CYCLE_BUDGET` for the
# swept table. Same "host stays faithful, embedded opts into the
# cheaper path" split as `wspr-pass2-topn` above.
wspr-fano-cap-fast = []

# Replace the callsign hash table's three tables with one 256-entry
# table — an embedded trade in the same "host stays faithful, embedded
# opts into the cheaper thing" shape as the two above. 83 KB to 7 KB.
#
# Upstream keeps three tables because on a PC it can. The 10- and
# 12-bit ones are arrays indexed by the hash itself — 1 024 and 4 096
# slots, `packjt77.f90:5-6` — which needs no search and stores no key,
# at the cost of sizing them by key space rather than by traffic. A
# receiver hears on the order of 100 distinct callsigns in 15 minutes
# (measured, CoreS3 on 40 m, 2026-09-20), so 97 % of those 66 KB hold
# nothing. This feature stores each callsign once beside its three
# hashes and scans for the one wanted.
#
# **What it costs is eviction policy, not capacity.** A direct-indexed
# slot keeps its callsign until a colliding hash overwrites it, which
# may be never; one unified LRU evicts by recency, so all three widths
# forget a station together and an old one renders `<...>` again. The
# 10- and 12-bit hashes appear in DXpedition and Type-4 messages,
# which name the station being worked *now*, so the depth that matters
# should be recent — but **how often this actually costs a resolution
# has not been measured on air.** The instrument exists: count
# `<...>`-bearing decodes per slot with and without this flag, the way
# `m5stack-cores3-app/src/decode_pipeline.rs` already counted 69 of
# 380. Measure before relying on it, as `wspr-fano-cap-fast` was.
#
# 256 and not 100 because of an allocator threshold: one entry is
# 28 B, so 100 would be 2.8 KB — under the CoreS3's
# `CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096`, putting the result back
# in the internal DRAM this exists to stop consuming. 256 is 7.2 KB,
# over the line and into PSRAM, and still a quarter of upstream's
# 1 000. `hash_table.rs`'s
# `the_unified_table_stays_above_the_psram_threshold` asserts it.
hash-table-small = []

# Use the streaming down-converter (`wspr::ddc`) instead of wsprd's
# whole-slot FFT channelizer (`wspr::baseband::decimate_to_baseband`).
# Off by default — host keeps the reference, which is exact.
#
# Embedded has no choice: the reference needs an 11.25 MiB
# `Complex<f32>` buffer on an 8 MB PSRAM part, at an FFT size
# (1 474 560) that is neither a power of two nor within `esp-dsp`'s
# 8 192 ceiling. Until this existed, the embedded WSPR bench was fed a
# baseband baked on a host, so every device timing was the downstream
# of a stage that did not exist there (issue #260).
#
# The two are not identical — bin selection is a brick wall, a FIR is
# not — so turning this on for a host run is also how the difference
# gets measured, against the same golden and AWGN corpus as everything
# else.
wspr-ddc = []

# Same channelizer swap as `wspr-ddc`, but selects the two-stage
# cascade (`wspr::ddc::ddc_to_baseband_cascade`) instead of the
# original single-stage `StreamingDdc`. Mutually exclusive with
# `wspr-ddc` (see the `compile_error!` in `decode_scan_inner`).
#
# The cascade is ~4.5x cheaper and small enough to auto-place in
# internal DRAM on an ESP32-S3 (see `wspr::ddc`'s cascade doc comment
# for the Crochiere-Rabiner derivation) — this feature is what lets
# `tests/wspr_wsjtx_samples.rs`'s dedicated golden test measure its
# real-signal recall/precision against the WSJT-X reference recording,
# the same way `wspr-ddc` already did for the single-stage filter.
wspr-ddc-cascade = []

# MSK144 (issue #25) — full port landed: LDPC(128,90) + MSK/OQPSK DSP
# (Phase 1-2), burst-scan sync search (Phase 3, needs `fft-rustfft` /
# `fft-extern` for the sub-modules that use it), per-frame decode
# (Phase 4), and the top-level sliding-window driver
# (`msk144::decode::decode_slot`, Phase 5). Golden-WAV regression
# against both WSJT-X `samples/MSK144/*.wav` recordings passes 3/3
# (`tests/msk144_wsjtx_samples.rs`). No `Protocol`-trait ZST is wired
# (MSK144 isn't FSK — its own top-level driver bypasses
# `engine::pipeline` entirely by design), so it doesn't appear in
# `PROTOCOLS`/`protocol_invariants.rs`; that's an intentional
# architectural difference from the other WSJT-family modes, not a
# gap.
msk144       = []

# Heavy modes — jt9/jt65/q65 imply the host build via `fft-rustfft`,
# which transitively requires `std`. Since #390 every FFT they run goes
# through `engine::fft`, so the backend is no longer what pins them.
# What does: the modules lean on `std` (prelude `Vec`, `f32` methods —
# 64 / 48 / 117 errors under `alloc,<mode>,fft-extern`, counted
# 2026-09-23), and JT9's `downsam9` inverse FFT assumes rustfft's
# unscaled convention, which the ESP backend does not share (see
# `wspr::subtract`'s explicit `#[cfg]` on the same point).
#
# `fst4` is NOT one of these, despite living in this block historically
# — issue #306 (embedded FST4 feasibility) found no actual `rustfft`
# reference anywhere under `src/fst4/`: `fst4::decode` routes entirely
# through `engine::pipeline`/`engine::dsp::downsample`/`engine::sync`,
# the same FFT-backend-agnostic machinery FT8/WSPR already use on
# embedded (`with_default_planner`, gated by whichever of
# `fft-rustfft`/`fft-extern` the caller picked). `cargo check -p
# mfsk-core --no-default-features --features
# alloc,fst4,fft-extern,internal-testing` type-checks clean with zero
# `std`/`rustfft` pulled in. Left unqualified (no forced backend) to
# match `ft8`/`ft4`/`wspr` above — a caller wanting the host default
# still gets `fft-rustfft` via `full`/`default`, unaffected.
fst4         = []
jt9          = ["fft-rustfft"]
jt65         = ["fft-rustfft"]
q65          = ["fft-rustfft"]

# uvpacket pulls in fst4 because it reuses the Ldpc240_101 codec
# whose `Wsjt77Message::verify_info` length-dispatch logic (CRC-24
# vs CRC-14) is wired through fst4's path.
#
# `std` is declared explicitly rather than inherited: `uvpacket` reaches
# for `std::f32::consts::PI` and std's prelude (`Vec`, `vec!`) throughout
# `tx.rs`/`rx.rs`/`interleaver.rs`/`puncture.rs`. It used to get `std` for
# free through the old `fst4 = ["fft-rustfft"]` grouping, which `aa59720`
# correctly removed — leaving this feature depending on a transitive it
# never declared, and `--features uvpacket` alone unbuildable. Making
# uvpacket genuinely no_std-capable is separate, deliberate work; nothing
# under `embedded-poc/` references it today.
uvpacket     = ["fst4", "std"]
parallel     = ["std", "dep:rayon"]

# Test-only visibility escape hatch (issue #203). `engine::pipeline`'s
# pre-#191 raw engine functions (`decode_frame`, `process_candidate_basic`,
# `osd_escalation_gates`, the `GenericPipelineProtocol` trait) are
# `pub(crate)` by default so downstream consumers can't bypass
# `DecodeRequest`/`SniperRequest` (#191) — but `mfsk-core/tests/*.rs`
# integration tests (`fst4_sweep.rs`, `ft4_sweep.rs`,
# `fst4_wsjtx_samples.rs`) are compiled as separate crates and need real
# `pub` visibility to call these diagnostics directly. Deliberately NOT
# part of `full` — enabling `full` is a normal downstream choice and must
# not silently reopen this surface. CI passes this alongside `full` only
# for `cargo test`/`cargo clippy --all-targets`; the `cargo doc`/
# `cargo publish` steps omit it so the public docs and crates.io tarball
# stay on the `pub(crate)` shape.
internal-testing = []

[dependencies]
# `num-complex` carries the `Float` trait via num-traits; under no_std
# we need `libm` to provide sin/cos/sqrt/etc. The std build pulls
# them via num-traits/std (transitively from rustfft) and ignores libm.
num-complex = { version = "0.4", default-features = false, features = ["libm"] }
# Direct dep so call sites can `use num_traits::Float` to get
# `.atanh()` / `.tanh()` / `.sqrt()` / etc. under no_std. The `libm`
# feature provides the actual math impls; under std these become
# no-op forwards to the f32 inherent methods.
num-traits  = { version = "0.2", default-features = false, features = ["libm"] }
rustfft     = { version = "6", optional = true }
crc         = { version = "3", default-features = false }
rayon       = { version = "1", optional = true }
# Optional `Serialize`/`Deserialize` for the host-facing `msg::decoded::Decoded`
# UI row (and `ProtocolId`). `default-features = false` + `alloc` keeps it
# no_std-clean (Decoded carries a `String`); host consumers wanting JSON for
# spotting / websocket / IPC turn on `--features serde`.
serde       = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
# Real-input FFT for `jt9::softsym::AudioFft::build` — see the `jt9`
# feature's doc comment above. `default-features = false`: this crate
# only needs the portable scalar path, not the `avx`/`neon`/`sse`
# rustfft-passthrough features (those are auto-detected by rustfft at
# compile time on their native targets via our plain
# `rustfft = { version = "6" }` dependency above, no feature flag
# needed — but see the wasm32-only override below: `wasm_simd` is NOT
# implied the same way and needs an explicit opt-in).
realfft     = { version = "3.5.0", default-features = false, optional = true }

# rustfft's `wasm_simd` feature is a real, separate opt-in — unlike
# avx/sse/neon on their native targets, it is NOT enabled by the plain
# dependency above. Verified 2026-08-09 (A/B via Cargo feature
# unification in bench/wasm/, `node --prof` under wasm32-unknown-unknown):
# forcing it on measurably speeds up FT8 decode — ~15-17% on the
# default single-pass strategy, ~23-30% on `.sic_early()` (the
# FFT-heavier multipass strategy, per a `node --prof` breakdown showing
# ~66% of its wall-clock in FFT/subtract), on `qso3_busy.wav`. Recall
# unchanged (14/22 stations either way). This override reaches
# mfsk-core's own `rustfft` dependency for any wasm32 build via Cargo
# feature unification — no caller action needed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustfft     = { version = "6", optional = true, features = ["wasm_simd"] }

[dev-dependencies]
# Only for tests/ft8_decode_block_streaming.rs, which exercises the
# true no_std decode_block_multipass arm (needs `fft-extern`, not the
# host-default `fft-rustfft`) — that arm still needs *some* FftPlanner,
# and `fft-extern`'s contract is that the final binary supplies
# `mfsk_core_make_default_fft_planner` itself (see
# `engine::fft::default_planner`'s doc comment: "tests / unusual
# targets can return any Box<dyn FftPlanner> impl"). This dev-only
# rustfft lets that one test provide it without touching the main
# `fft-rustfft` feature/dependency.
rustfft = "6"

# There is deliberately no `[lints.rust] unexpected_cfgs` block with a
# hand-written `check-cfg` list here. There was one, naming every
# feature, and it did nothing: Cargo emits `--check-cfg=cfg(feature,
# values(...))` for every feature declared above, so a typo'd
# `#[cfg(feature = "ft88")]` is caught with or without it. Measured
# 2026-09-21 by deleting one entry and rebuilding -- no warning, which
# is also how five features (`default`, `dotprod-extern`,
# `fixed-point-llr`, `internal-testing`, `serde`) had drifted out of
# the list with no consequence and nobody noticed.
#
# A list that must be maintained and never fails when it is not is
# worse than no list, so: if a custom `--cfg` is ever introduced here
# (`docsrs` is the likely one -- see the docs.rs block below, which
# passes the flag but nothing in `src/` reads it), add the block back
# for *that*, not for features.

# Build docs.rs with every protocol feature enabled so users browsing
# the online docs see the complete API. The `--cfg docsrs` flag lets
# us expose feature-gated items with visible "available on crate
# feature …" badges (this build passes it; gate any such annotation
# on `#[cfg(docsrs)]` if we ever add one).
#
# **`features`, not `all-features`.** This crate has a mutually
# exclusive pair -- `wspr-ddc` and `wspr-ddc-cascade` select different
# WSPR channelizers and `wspr::decode` refuses both with a
# `compile_error!` -- so `all-features = true` cannot build. It did not
# fail locally because no local command enables both either: the
# pre-commit hook and CI's `docs` job document `--features full`, and
# the feature matrix builds each of them alone. docs.rs was the one
# builder that asked for everything, and v0.11.0's documentation build
# failed there with exactly that `compile_error!` while every gate in
# this repository stayed green.
#
# `full` is the right surface anyway: it is every protocol plus
# `uvpacket`, `packet-bytes`, `serde`, `parallel` and the host FFT --
# the API a crates.io consumer sees. What it leaves out are build-shape
# knobs rather than API (`fixed-point`, `fft-extern`,
# `dotprod-extern`, the two channelizers, `internal-testing`), each
# documented in the feature table above.
[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]
