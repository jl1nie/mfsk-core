name: FFI binaries

# The prebuilt `mfsk-ffi` library for the platforms the C ABI, Kotlin and Swift
# name (#368), beside the linux-x86_64 one `release.yml` builds itself:
#
#   windows-x86_64-gnu       MinGW; desktop features, DLL + import library + static library
#   windows-x86_64-msvc      MSVC; desktop features, DLL (C runtime linked in) + import library
#   android-arm64-v8a        `mobile` features, a jniLibs tree, 16 KB aligned
#   ios                      `mobile` features, an XCFramework (device + simulator)
#
# These are the builds `ci.yml` already makes per PR (its `cross` and `swift`
# jobs) and throws away after checking them; this keeps them. The checks come
# along, so an artifact that would not load is not attached.
#
# Called by `release.yml` on a tag. It also runs by hand (Actions > FFI
# binaries > Run workflow) and on a PR that edits this file, so the release
# path is exercised before a tag has to prove it: the artifacts of such a run
# are named for the branch (`mfsk-ffi-main-...`) and are never attached to
# anything.
#
# Artifact names start with `ffi-`: `release.yml`'s publish job downloads that
# pattern.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ffi-binaries.yml'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-x86_64-gnu:
    name: mfsk-ffi — windows-x86_64-gnu (MinGW)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2

      # As ci.yml's `cross` job installs it, and for the reason it gives: the
      # download is what costs, so the .debs are cached; the win32 threading
      # variant is the one the DLL is linked with.
      - name: Restore the MinGW packages
        uses: actions/cache@v4
        with:
          path: ~/apt-mingw
          key: apt-mingw-win32-${{ runner.os }}-noble-v1
      - name: Install the MinGW linker
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p ~/apt-mingw/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-mingw" \
            -o Acquire::Retries=3 \
            gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          sudo chown -R "$(id -u):$(id -g)" ~/apt-mingw
          rm -rf ~/apt-mingw/partial ~/apt-mingw/lock

      - name: Build
        run: cargo build -p mfsk-ffi --release --target x86_64-pc-windows-gnu

      - name: The DLL exports the ABI
        run: |
          set -euo pipefail
          DLL=target/x86_64-pc-windows-gnu/release/mfsk.dll
          test -f "$DLL" || { echo "::error::no DLL produced"; exit 1; }
          for sym in mfsk_abi_version mfsk_decoder_open mfsk_decoder_decode_i16 \
                     mfsk_mode_count mfsk_pack77 mfsk_stream_open \
                     mfsk_jtty_open mfsk_msk144_open mfsk_iq_open; do
            x86_64-w64-mingw32-nm -g --defined-only "$DLL" | grep -q " $sym\$" \
              || { echo "::error::$sym is not exported from the DLL"; exit 1; }
          done

      - name: Package
        run: |
          set -euo pipefail
          NAME=${GITHUB_REF_NAME//\//-}   # a PR run is "677/merge"
          PKG=mfsk-ffi-${NAME}-windows-x86_64-gnu
          T=target/x86_64-pc-windows-gnu/release
          mkdir -p "$PKG"/{bin,lib,include}
          cp "$T/mfsk.dll"        "$PKG"/bin/
          IMP=$(ls "$T"/*mfsk*.dll.a 2>/dev/null | head -1)
          test -n "$IMP" || { echo "::error::no import library in $T"; ls "$T"; exit 1; }
          cp "$IMP" "$PKG"/lib/
          cp "$T/libmfsk.a"       "$PKG"/lib/
          cp mfsk-ffi/include/mfsk.h "$PKG"/include/
          cp mfsk-ffi/README.md      "$PKG"/
          cat > "$PKG"/WINDOWS.txt <<'EOF'
          Built with MinGW-w64 (x86_64-pc-windows-gnu), the desktop feature set.
          bin/mfsk.dll       the library
          lib/libmfsk.dll.a  its import library, for MinGW / MSYS2 (-lmfsk)
          lib/libmfsk.a      the static library (MinGW; define MFSK_STATIC)
          From MSVC use the windows-x86_64-msvc package instead (its own import library).
          The DLL needs only system DLLs (no libgcc / libwinpthread).
          EOF
          zip -r "$PKG".zip "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-windows-x86_64-gnu
          path: mfsk-ffi-*-windows-x86_64-gnu.zip
          if-no-files-found: error
          retention-days: 14

  # The MSVC build, and the one place the Windows artifacts are *run*. The C++
  # driver (mfsk-ffi/examples/cpp_smoke) is compiled with cl and run on Windows
  # against this build's DLL and then against the MinGW package's, so a DLL that
  # would not load there (a missing runtime, a wrong export) fails here rather
  # than in a user's hands. Tried by hand first on Windows 11 / VS 2022 (#368).
  windows-x86_64-msvc:
    name: mfsk-ffi — windows-x86_64-msvc
    needs: windows-x86_64-gnu
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      # The C runtime linked in: a DLL built the default way imports
      # VCRUNTIME140.dll, which is not part of Windows (it comes with the VC++
      # Redistributable), so on a PC without it the DLL does not load. The C ABI
      # hands no CRT resource across (the library frees what it allocates), so a
      # caller on a different CRT is safe. The static library is not packaged: it
      # would carry this choice into the caller's link.
      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build -p mfsk-ffi --release

      - name: The DLL imports system DLLs only, and exports the ABI
        run: |
          $deps = (dumpbin /dependents target\release\mfsk.dll) -join "`n"
          Write-Host $deps
          if ($deps -match 'VCRUNTIME|MSVCP|MSVCR|api-ms-win-crt|ucrtbase') {
            throw "the DLL depends on the C runtime"
          }
          $exports = (dumpbin /exports target\release\mfsk.dll) -join "`n"
          foreach ($sym in 'mfsk_abi_version','mfsk_decoder_open','mfsk_decoder_decode_i16',
                           'mfsk_mode_count','mfsk_pack77','mfsk_stream_open','mfsk_jtty_open',
                           'mfsk_msk144_open','mfsk_iq_open') {
            if ($exports -notmatch "\b$sym\b") { throw "$sym is not exported" }
          }

      - name: Build the C++ driver with MSVC
        shell: cmd
        run: mfsk-ffi\examples\cpp_smoke\build_msvc.bat

      - name: The driver runs against the MSVC DLL
        run: |
          $env:MFSK_JTTY_WAV = "$PWD\embedded-poc\assets\golden\jtty\260807_134110.wav"
          $env:MFSK_MSK144_WAV = "$PWD\embedded-poc\assets\golden\msk144\181211_120800.wav"
          Push-Location mfsk-ffi\examples\cpp_smoke
          .\cpp_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "cpp_smoke exited with $LASTEXITCODE" }
          Pop-Location

      # The package `windows-x86_64-gnu` made, loaded by the same executable (it
      # imports by name, so any `mfsk.dll` exporting the ABI binds): the MinGW DLL
      # starting on Windows without the MinGW runtime beside it is what is checked.
      - uses: actions/download-artifact@v4
        with:
          name: ffi-windows-x86_64-gnu
          path: gnu
      - name: The driver runs against the MinGW package's DLL
        run: |
          Expand-Archive gnu\*.zip -DestinationPath gnu\x
          $dll = (Get-ChildItem gnu\x -Recurse -Filter mfsk.dll | Select-Object -First 1).FullName
          $deps = (dumpbin /dependents $dll) -join "`n"
          Write-Host $deps
          if ($deps -match 'libgcc|libwinpthread|libstdc') { throw "the MinGW DLL needs the MinGW runtime" }
          $d = "$PWD\mingw-run"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item mfsk-ffi\examples\cpp_smoke\cpp_smoke.exe $d
          Copy-Item $dll $d
          $env:MFSK_JTTY_WAV = "$PWD\embedded-poc\assets\golden\jtty\260807_134110.wav"
          $env:MFSK_MSK144_WAV = "$PWD\embedded-poc\assets\golden\msk144\181211_120800.wav"
          Push-Location $d
          .\cpp_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "cpp_smoke (MinGW DLL) exited with $LASTEXITCODE" }
          Pop-Location

      - name: Package
        run: |
          $name = $env:GITHUB_REF_NAME -replace '/', '-'   # a PR run is "678/merge"
          $pkg = "mfsk-ffi-$name-windows-x86_64-msvc"
          New-Item -ItemType Directory "$pkg\bin","$pkg\lib","$pkg\include" | Out-Null
          Copy-Item target\release\mfsk.dll "$pkg\bin\"
          Copy-Item target\release\mfsk.dll.lib "$pkg\lib\"
          Copy-Item mfsk-ffi\include\mfsk.h "$pkg\include\"
          Copy-Item mfsk-ffi\README.md "$pkg\"
          @'
          Built with MSVC (x86_64-pc-windows-msvc), the desktop feature set, rustc's
          C runtime linked in (-C target-feature=+crt-static): bin\mfsk.dll imports
          system DLLs only, so no VC++ Redistributable is needed.
          bin\mfsk.dll       the library
          lib\mfsk.dll.lib   its import library: cl ... mfsk.dll.lib, with mfsk.dll beside the exe
          include\mfsk.h     the header (define nothing: MFSK_API is __declspec(dllimport))
          No static library is provided (it would carry the C runtime choice into your
          link); build mfsk-ffi from source for one. MinGW users: the -gnu package.
          '@ | Set-Content "$pkg\WINDOWS.txt"
          # Not Compress-Archive: Windows PowerShell 5.1 writes backslashes into the
          # entry names, which unzip elsewhere reads as part of a file name.
          python -m zipfile -c "$pkg.zip" $pkg
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-windows-x86_64-msvc
          path: mfsk-ffi-*-windows-x86_64-msvc.zip
          if-no-files-found: error
          retention-days: 14

  android-arm64:
    name: mfsk-ffi — android-arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The `mobile` features drop rayon (see mfsk-ffi/Cargo.toml). The 16 KB
      # page flag is repeated here as ci.yml's `cross` job repeats it: an
      # environment RUSTFLAGS overrides `target.*.rustflags` rather than merging.
      - name: Build
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -o jniLibs build -p mfsk-ffi --release \
            --no-default-features --features mobile

      # Android 15 devices with a 16 KB kernel page do not load a library linked
      # for 4 KB, and say so as a silent UnsatisfiedLinkError.
      - name: The .so is 16 KB aligned
        run: |
          set -euo pipefail
          SO=jniLibs/arm64-v8a/libmfsk.so
          test -f "$SO" || { echo "::error::no .so produced"; exit 1; }
          ALIGN=$(readelf -lW "$SO" | awk '$1 == "LOAD" { print $NF; exit }')
          [ "$ALIGN" = "0x4000" ] \
            || { echo "::error::expected 0x4000 (16 KB), got $ALIGN"; exit 1; }
      - name: The mobile build really has no rayon
        run: |
          set -euo pipefail
          if cargo tree -p mfsk-ffi --no-default-features --features mobile -e normal | grep -q rayon; then
            echo "::error::the mobile feature still pulls rayon"; exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          NAME=${GITHUB_REF_NAME//\//-}
          PKG=mfsk-ffi-${NAME}-android-arm64-v8a
          mkdir -p "$PKG"/include
          cp -r jniLibs "$PKG"/
          cp mfsk-ffi/include/mfsk.h "$PKG"/include/
          cp mfsk-ffi/README.md      "$PKG"/
          printf '%s\n' \
            'The `mobile` feature set (no rayon), arm64-v8a only, 16 KB page aligned.' \
            'jniLibs/arm64-v8a/libmfsk.so goes under src/main/jniLibs/ of an app module;' \
            'the Kotlin binding (bindings/kotlin) loads it as "mfsk". Other ABIs: build them' \
            'with cargo-ndk (see mfsk-ffi/README.md); this one is the only one CI checks (#368).' \
            > "$PKG"/ANDROID.txt
          tar -czvf "$PKG".tar.gz "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-android-arm64
          path: mfsk-ffi-*-android-arm64-v8a.tar.gz
          if-no-files-found: error
          retention-days: 14

  ios:
    name: mfsk-ffi — iOS XCFramework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      # Builds both slices with the `mobile` features, packages them, and links a
      # two-line Swift program against each (bindings/swift/scripts/build-xcframework.sh).
      - name: Build the XCFramework
        run: bindings/swift/scripts/build-xcframework.sh target/xcframework

      # What a Package.swift `.binaryTarget(url:checksum:)` asks for: a zip, and the
      # SHA-256 of that zip.
      - name: Package
        run: |
          set -euo pipefail
          NAME=${GITHUB_REF_NAME//\//-}
          ZIP="$PWD/mfsk-ffi-${NAME}-ios.xcframework.zip"
          (cd target/xcframework && ditto -c -k --sequesterRsrc --keepParent Mfsk.xcframework "$ZIP")
          shasum -a 256 "$ZIP" | awk '{print $1}' > "$ZIP".sha256
          echo "checksum: $(cat "$ZIP".sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-ios
          path: |
            mfsk-ffi-*-ios.xcframework.zip
            mfsk-ffi-*-ios.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 14
