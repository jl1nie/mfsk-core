name: CI

on:
  push:
    branches: [main]
    # `embedded-poc/**` are stand-alone xtensa / cortex-m binary
    # crates with their own toolchains. Excluded from the host
    # workspace and not built by host CI; skip the workflow if the
    # only changes are inside that tree. `bench/wasm/**` is the same
    # deal for a different target (wasm32-unknown-unknown, issue #208)
    # — a manual/periodic tool, not CI-gated.
    paths-ignore:
      - 'embedded-poc/**'
      - 'bench/wasm/**'
  pull_request:
    paths-ignore:
      - 'embedded-poc/**'
      - 'bench/wasm/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Opt every JS-based action into the Node.js 24 runtime ahead of
  # GitHub's 2026-09-16 deprecation of Node 20. Lets us keep the
  # actions pinned at @v4 / @v2 / @v1.5 without chasing individual
  # release bumps; the action authors will republish Node-24-native
  # versions over time and this env var becomes a no-op.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel in-flight runs on the same ref when a new commit arrives
# (typical case: a PR force-push or a fast-follow `--amend`). The
# group key uses `head_ref` for `pull_request` events (the source
# branch) and falls back to `ref` for `push` events on `main`. This
# does NOT dedupe the PR-vs-post-merge pair (different refs), but it
# does prevent run pile-ups on rapid PR iterations.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # Path-filter pre-pass — works out which slow-sweep matrix entries
  # in `test:` actually need to run on this PR. Sweeps are decoder
  # characterisation tests (SNR sensitivity curves, real-QSO recall
  # regression) and only catch regressions when source under the
  # protocol's own tree (or the shared core / fec / msg / lib /
  # Cargo.toml / build.rs / CI yaml itself) actually changes.
  #
  # Pre-this-filter every PR ran every sweep — the 6-PR ε refactor
  # burned ~30 min of CI on sweeps that couldn't possibly have
  # regressed because not one byte under decoder src had moved.
  #
  # Behaviour:
  #   - `push` to main: ALL sweeps run unconditionally
  #     (post-merge regression safety net).
  #   - `pull_request`: a sweep matrix entry runs only if its
  #     `changes` output flag is true.
  #
  # The `default` suite always runs (cross-cutting; covers every
  # protocol's non-ignored tests + lint-equivalent compile failures).
  # ───────────────────────────────────────────────────────────────
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      ft8: ${{ steps.filter.outputs.ft8 }}
      q65: ${{ steps.filter.outputs.q65 }}
      uvpacket: ${{ steps.filter.outputs.uvpacket }}
      catchall: ${{ steps.filter.outputs.catchall }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # `src` is the docs-only escape hatch (issue #113). True when
            # any compilation-relevant input changed. False on pure
            # docs/CHANGELOG/README/rustdoc-only PRs, which lets the
            # Build/Test/C++ matrix skip while rustfmt+clippy, rustdoc,
            # and publish-dry-run still run as the doc-surface gate.
            # `Cargo.lock` is in because `cargo update` legitimately
            # changes what gets compiled.
            src:
              - '.github/workflows/**'
              - 'Cargo.lock'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/**'
              - 'mfsk-core/tests/**'
              - 'mfsk-core/examples/**'
              - 'mfsk-core/benches/**'
              - 'mfsk-ffi/**'
            ft8:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              # Shared DSP/decode engine: a change here reaches every
              # protocol that routes through `engine::pipeline` /
              # `engine::sync`, so it must trip every protocol filter.
              # Omitting it meant an `engine/sync.rs` edit ran no
              # protocol tier (issue: FT4 sniper `rank_candidates`).
              - 'mfsk-core/src/engine/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/ft8/**'
              - 'mfsk-core/tests/ft8_*'
              - 'mfsk-core/tests/common/**'
            q65:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              # Shared DSP/decode engine: a change here reaches every
              # protocol that routes through `engine::pipeline` /
              # `engine::sync`, so it must trip every protocol filter.
              # Omitting it meant an `engine/sync.rs` edit ran no
              # protocol tier (issue: FT4 sniper `rank_candidates`).
              - 'mfsk-core/src/engine/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/q65/**'
              - 'mfsk-core/tests/q65_*'
              - 'mfsk-core/tests/common/**'
            uvpacket:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              # Shared DSP/decode engine: a change here reaches every
              # protocol that routes through `engine::pipeline` /
              # `engine::sync`, so it must trip every protocol filter.
              # Omitting it meant an `engine/sync.rs` edit ran no
              # protocol tier (issue: FT4 sniper `rank_candidates`).
              - 'mfsk-core/src/engine/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/uvpacket/**'
              - 'mfsk-core/tests/uvpacket_*'
              - 'mfsk-core/tests/common/**'
            # Gates the tier-C characterization suite only. Tier A+B
            # is gated by `src` above, which already covers every
            # protocol's sources — so a change to any protocol here
            # always runs the merge gate regardless of this filter.
            catchall:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              # Shared DSP/decode engine: a change here reaches every
              # protocol that routes through `engine::pipeline` /
              # `engine::sync`, so it must trip every protocol filter.
              # Omitting it meant an `engine/sync.rs` edit ran no
              # protocol tier (issue: FT4 sniper `rank_candidates`).
              - 'mfsk-core/src/engine/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/ft4/**'
              - 'mfsk-core/src/fst4/**'
              - 'mfsk-core/src/jt9/**'
              - 'mfsk-core/src/jt65/**'
              - 'mfsk-core/src/wspr/**'
              - 'mfsk-core/src/msk144/**'
              - 'mfsk-core/src/uvpacket/**'
              - 'mfsk-core/tests/ft4_*'
              - 'mfsk-core/tests/fst4_*'
              - 'mfsk-core/tests/msk144_*'
              - 'mfsk-core/tests/ldpc_min_sum*'
              - 'mfsk-core/tests/common/**'

  # ───────────────────────────────────────────────────────────────
  # Formatting + clippy lint gate. Fast fail so the heavier matrix
  # jobs don't burn runner minutes on a branch that wouldn't pass
  # the style fence anyway.
  # ───────────────────────────────────────────────────────────────
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `-D clippy::perf` escalates the perf group from warn to deny on
      # top of the default `-D warnings`. Catches mechanical perf
      # antipatterns (`clippy::useless_vec`, `redundant_allocation`,
      # `or_fun_call` allocating inside `unwrap_or`, `manual_memcpy`,
      # etc.) as a CI gate so we don't accumulate them between Gemini
      # reviews. main as of 2026-05-17 has 0 warnings under this group;
      # this PR fences in that property going forward. See
      # `~/.claude/projects/.../memory/feedback_pre_pr_self_review.md`
      # for the human-side checklist that catches what clippy can't
      # (e.g. `vec![0; LDPC_N]` in a hot loop — perf group misses this).
      #
      # `internal-testing` (issue #203) is added alongside `full` here
      # and in every `cargo test` invocation below because `--all-targets`
      # compiles `mfsk-core/tests/*.rs`, and some of those integration
      # tests (`fst4_sweep.rs`, `ft4_sweep.rs`, `fst4_wsjtx_samples.rs`)
      # call `core::pipeline` diagnostics that are `pub(crate)` on the
      # default feature set. Deliberately NOT added to the `cargo doc`
      # / `cargo publish` steps further down — those must keep building
      # the `pub(crate)` shape that downstream consumers actually see.
      - name: cargo clippy -- -D warnings -D clippy::perf
        run: cargo clippy --workspace --all-targets --features full,internal-testing --no-deps -- -D warnings -D clippy::perf

  # ───────────────────────────────────────────────────────────────
  # Core test suite on the "full" feature set, split into parallel
  # matrix jobs to keep wall-clock CI time low. Two tiers within the
  # `#[ignore]`'d sweep buckets:
  #
  #   recall tier         — load-bearing regression protection. Runs
  #                         on every PR matching the path filter
  #                         (current catchall recall hook:
  #                         `fst4_wsjtx_samples`; FT8's equivalent
  #                         hard-floor tests are all non-ignored now
  #                         and run in `default` instead — see below).
  #   characterization    — SNR sensitivity curves, depth/pass1 sweeps,
  #                         coarse-sync probes / concurrency stress,
  #                         and similar diagnostic-only tests (still
  #                         used by the `q65 sweeps` / `uvpacket
  #                         sweeps` entries below). Run on `push` to
  #                         main and on PRs carrying the
  #                         `run-full-sweep` label, but skipped on
  #                         regular PRs (caught post-merge, revert if
  #                         broken). FT8 had its own characterization
  #                         tier and a separate "ft8 recall" tier here
  #                         until 2026-07-18, both removed — see the
  #                         comment further down where they used to
  #                         sit, right after the `default` matrix entry.
  #
  # The non-ignored recall tests (qso3 apoff/apon/jtdx, all of
  # ft4/q65/uvpacket roundtrips + wsjtx_samples, protocol_invariants,
  # jt9/wspr wsjtx_samples) already run in the `default` suite — they
  # do not need a separate matrix entry.
  #
  # Behaviour gate per matrix entry:
  #   - `changes_key: always`            — always runs.
  #   - `changes_key: <name>`            — runs when paths-filter
  #                                        `<name>` is true OR on push
  #                                        to main.
  #   - `push_only: true` (+ changes_key) — runs on push to main, on
  #                                        PRs with `run-full-sweep`
  #                                        label, otherwise skipped
  #                                        (even when the filter would
  #                                        otherwise gate it in).
  #
  # A regular `mfsk-core/src/ft8/**` PR now runs only the ~2 min
  # recall tier — no post-merge characterization sweep either, since
  # that tier was removed entirely for FT8 (see above). Q65/uvpacket
  # still follow the original split: PR runs recall only, push-to-main
  # or `run-full-sweep` label also runs their characterization tier.
  # ───────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.suite.name }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          # `changes_key` selects which output of the `changes` job
          # gates this suite. `always` opts out of the gate entirely
          # (the default suite runs every PR for cross-cutting
          # coverage). `push_only: true` skips on regular PRs and
          # only runs on push-to-main or when the PR carries the
          # `run-full-sweep` label.
          # `src` gate (issue #113): default suite still covers every
          # protocol's non-ignored tests, but is skipped entirely on
          # docs-only PRs (README / CHANGELOG / docs/** / rustdoc) since
          # the inputs to the compiler/test binaries did not move.
          # Tiers A + B (see CONTRIBUTING.md "Testing philosophy"):
          # every non-ignored test, i.e. all invariants (unit,
          # roundtrip, bit-exact parity, TX waveform) plus all golden
          # fidelity (recall + precision + SNR accuracy). This is the
          # merge gate; everything else in this matrix is tier C.
          - name: tier A+B — invariants + golden
            kind: default
            changes_key: src
            push_only: false
          # The former "ft8 characterization" tier (SNR curves,
          # depth/pass1 sweeps, coarse-sync probe + concurrency
          # stress) was removed 2026-07-18: all six tests were
          # print-only diagnostics with no assertions, so this tier
          # could never fail — it only ever cost wall-clock (~10 min
          # push-only) for output nobody was routinely reading. One
          # of the six (`ft8_coarse_sync_concurrent`) required the
          # `fixed-point` feature, which `full` doesn't enable, so it
          # was already running zero tests.
          #
          # The separate "ft8 recall" tier (`ft8_decode_block_real_qso`,
          # `ft8_reference_suite_recall`) was audited the same day and
          # found to have the identical problem (print-only, no
          # assertions). `ft8_reference_suite_recall` (a PASS1_LIMIT/
          # max_cand embedded-tuning config sweep) was deleted outright.
          # `ft8_decode_block_real_qso` was converted to a hard-floor
          # assertion test (embedded ship config vs host `decode_frame`
          # truth on qso1/qso2/qso3_busy — qso1/qso2 have no WSJT-X
          # golden and were otherwise completely untested) and is no
          # longer `#[ignore]`'d, so it now runs in the `default` suite
          # below and needs no matrix entry of its own.
          #
          # Actual FT8 recall regression protection now lives entirely
          # in the `default` suite: `ft8_qso3_apoff_recall` /
          # `ft8_qso3_apon_recall` (WSJT-X-golden floors on qso3_busy)
          # plus `ft8_decode_block_real_qso` (host-truth floors on
          # qso1/qso2/qso3_busy).
          # Q65 sweeps are all characterization (ap_list, ap_sweep,
          # fast_fading, snr_sweep). Recall protection sits in the
          # non-ignored `q65_roundtrip` / `q65_eme_submodes` /
          # `q65_wsjtx_samples` which already run in default.
          - name: tier C — q65 sweeps
            kind: ignored-integration
            globs: "q65_*"
            changes_key: q65
            push_only: true
          # uvpacket sweeps are characterization (per_modes_sweep,
          # pi4_dqpsk_eq, ssb_channel, fm_channel, ldpc_direct,
          # snr_calibration). Recall in `uvpacket_multichannel` is
          # non-ignored and covered by default.
          - name: tier C — uvpacket sweeps
            kind: ignored-integration
            globs: "uvpacket_*"
            changes_key: uvpacket
            push_only: true
          # The former "catchall recall" tier is gone. It claimed to be
          # FST4 golden recall protection but ran `--ignored` tests in
          # `fst4_wsjtx_samples`, of which there is exactly one:
          # `fst4_60_diagnose_golden`, whose own ignore reason reads
          # "diagnostic probe, not a recall gate — run manually". So it
          # executed a print-only probe on every PR under a name that
          # misrepresented it. FST4's actual recall/precision/SNR
          # assertions are not `#[ignore]`d and run in tier A+B above.
          # catchall characterization — tier C sensitivity sweeps plus
          # the lib-level #[ignore] tests. `ft4_coherent_wide_search_diag`
          # and the FT8 `qso3_*` probes used to sit adjacent to these;
          # they were deleted, not moved, because they asserted nothing
          # and belonged to investigations that have since closed.
          #
          # What remains here still asserts nothing either — these are
          # measurements. They are kept because a release wants the
          # numbers (see `scripts/` sweep generators and
          # `docs/notes/*BENCHMARK.md`), not because they gate a merge.
          - name: tier C — characterization
            kind: catchall
            globs: "ft4_diag_low_snr ft4_snr_sweep ft4_timing_budget msk144_snr_sweep ldpc_min_sum bench_qso3_busy_timing"
            changes_key: catchall
            push_only: true
    steps:
      - uses: actions/checkout@v4

      - name: Gate (paths-filter + main-push + tier override)
        id: gate
        env:
          CHANGES_KEY: ${{ matrix.suite.changes_key }}
          PUSH_ONLY: ${{ matrix.suite.push_only }}
          EVENT_NAME: ${{ github.event_name }}
          SRC: ${{ needs.changes.outputs.src }}
          FT8: ${{ needs.changes.outputs.ft8 }}
          Q65: ${{ needs.changes.outputs.q65 }}
          UVPACKET: ${{ needs.changes.outputs.uvpacket }}
          CATCHALL: ${{ needs.changes.outputs.catchall }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        # Two-stage gate.
        #
        # Stage 1 — should this suite run at all on this event?
        #   - `push` to main: yes (post-merge regression net).
        #   - `pull_request`: only if `PUSH_ONLY != true` OR the PR
        #     carries the `run-full-sweep` label (manual opt-in for
        #     when you want the heavy characterization sweep verified
        #     before merge — e.g. for a behavioural change you want
        #     the SNR curve on).
        #
        # Stage 2 — does this suite's paths-filter say it's relevant?
        #   - `changes_key: always`: yes, unconditionally (default
        #     suite is cross-cutting).
        #   - On push events: yes, all sweeps run (skip the filter so
        #     post-merge always sees the full picture).
        #   - Otherwise: gate on the named `changes` output.
        run: |
          set -e
          should_run=false
          tier_gate_ok=false
          if [ "$EVENT_NAME" = "push" ]; then
            tier_gate_ok=true
          elif [ "$PUSH_ONLY" != "true" ]; then
            tier_gate_ok=true
          elif echo "$PR_LABELS" | grep -q '"run-full-sweep"'; then
            tier_gate_ok=true
            echo "::notice::run-full-sweep label set — running push_only suite '${{ matrix.suite.name }}' on this PR."
          fi
          if [ "$tier_gate_ok" = "true" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              should_run=true
            elif [ "$CHANGES_KEY" = "always" ]; then
              should_run=true
            else
              case "$CHANGES_KEY" in
                src)      [ "$SRC" = "true" ]      && should_run=true ;;
                ft8)      [ "$FT8" = "true" ]      && should_run=true ;;
                q65)      [ "$Q65" = "true" ]      && should_run=true ;;
                uvpacket) [ "$UVPACKET" = "true" ] && should_run=true ;;
                catchall) [ "$CATCHALL" = "true" ] && should_run=true ;;
              esac
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "false" ]; then
            if [ "$PUSH_ONLY" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::notice::Skipping push-only suite '${{ matrix.suite.name }}' on PR (add 'run-full-sweep' label to force)."
            else
              echo "::notice::Skipping suite '${{ matrix.suite.name }}' — no relevant source changes on this PR."
            fi
          fi

      - name: Install Rust (stable)
        if: steps.gate.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.gate.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run suite
        if: steps.gate.outputs.should_run == 'true'
        env:
          SUITE_KIND: ${{ matrix.suite.kind }}
          SUITE_GLOBS: ${{ matrix.suite.globs }}
          # Turn a missing golden corpus into a hard failure instead of
          # a silent skip. Before the recordings were vendored under
          # `embedded-poc/assets/golden/`, every WSJT-X-sample test
          # resolved from a sibling `../../WSJT-X/` checkout that CI
          # does not have — so FT4/FST4/Q65/WSPR/MSK144 golden tests
          # all skipped and reported success, and the only protocols
          # genuinely covered here were FT8 and JT9. See
          # `tests/common/corpus.rs`.
          MFSK_REQUIRE_CORPUS: "1"
        # The `default` suite runs every non-ignored test (lib +
        # integration) across every protocol — no substring filter so
        # cargo test runs the lot. The `ignored-integration` suites
        # use multiple `--test <name>` flags to scope cargo down to
        # the integration test binaries that own the matching slow
        # sweeps, then `-- --ignored` to run *only* the #[ignore]'d
        # functions in those binaries (the non-ignored ones already
        # ran in the `default` suite — no double coverage). The
        # `catchall` suite also picks up `--lib -- --ignored` (jt9 +
        # uvpacket::puncture src-level sweeps) and the env-gated FST4
        # roundtrip.
        run: |
          set -euo pipefail
          case "$SUITE_KIND" in
            default)
              cargo test -p mfsk-core --features full,internal-testing --release
              ;;
            ignored-integration|catchall)
              test_args=""
              for pat in $SUITE_GLOBS; do
                for f in mfsk-core/tests/$pat.rs; do
                  [ -f "$f" ] || continue
                  test_args="$test_args --test $(basename "$f" .rs)"
                done
              done
              if [ -n "$test_args" ]; then
                cargo test -p mfsk-core --features full,internal-testing --release $test_args -- --ignored
              fi
              if [ "$SUITE_KIND" = "catchall" ]; then
                cargo test -p mfsk-core --features full,internal-testing --release --lib -- --ignored
              fi
              ;;
          esac

  # ───────────────────────────────────────────────────────────────
  # Feature matrix: every single-protocol feature must compile on
  # its own (no-default-features + exactly one protocol). Catches
  # cross-feature dependencies that only show up when a particular
  # combination is disabled.
  # ───────────────────────────────────────────────────────────────
  feature-matrix:
    name: Build (${{ matrix.features }})
    needs: changes
    # Skip on docs-only PRs (issue #113). On push to main, always run
    # as a post-merge safety net even if the merge commit only touched
    # docs (defensive — a rebase could surface a regression).
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""           # no features at all — foundation-only
          - "ft8"
          - "ft4"
          - "fst4"
          - "wspr"
          - "jt9"
          - "jt65"
          - "q65"
          - "msk144"
          - "uvpacket"
          - "alloc ft8"            # no_std + alloc baseline (TX-side host compile)
          - "alloc ft8 fft-extern" # no_std + alloc + caller-supplied FFT (RX preset)
          - "alloc ft8 fft-extern fixed-point" # full embedded integer pipeline
          - "alloc ft4 fft-extern"             # FT4 through the generic pipeline, no_std
          - "alloc ft4 fft-extern fixed-point" # same, with the integer implications on
          - "wspr wspr-pass2-topn" # embedded WSPR pass-2 candidate-ladder truncation + budget
          - "full"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build -p mfsk-core --no-default-features --release
          else
            cargo build -p mfsk-core --no-default-features --features "${{ matrix.features }}" --release
          fi

  # ───────────────────────────────────────────────────────────────
  # mfsk-ffi: cdylib build + Rust-level ABI tests + the C++ driver
  # (every mode's round trip, the decode session, streaming capture,
  # the TX pipeline, and a thread fan-out). The crate does not publish
  # to crates.io but it is a real ABI that C/C++/Kotlin consumers link
  # against, so regressions here need catching.
  #
  # The driver is a separate translation unit on purpose: it compiles
  # against the generated header, so it catches things no Rust test
  # can — a macro-generated `extern "C"` function that never reached
  # the header, and an out-of-range enum argument that segfaulted.
  #
  # `mfsk-ffi-ft8` used to be built and tested here too; it was retired
  # (issue #251's own exit condition) once the v2 ABI covered its
  # streaming and TX pipelines for every mode rather than FT8 alone.
  # ───────────────────────────────────────────────────────────────
  ffi:
    name: mfsk-ffi + C++ driver
    needs: changes
    # Skip on docs-only PRs (issue #113); see feature-matrix for the
    # push-to-main rationale.
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `embedded-poc/mfsk-app-shared` is excluded from the workspace
      # (esp-idf-svc, Xtensa-only), so unit tests written inside it run
      # nowhere. `hosttest/mfsk-app-shared` compiles its
      # target-independent modules on the host so they do — same reason
      # `MFSK_REQUIRE_CORPUS` exists.
      - name: cargo test -p mfsk-app-shared-hosttest
        run: cargo test -p mfsk-app-shared-hosttest --release

      - name: Build mfsk-ffi
        run: cargo build -p mfsk-ffi --release

      # The build above regenerates `include/mfsk.h` into the source tree,
      # so a signature change that was not rebuilt locally shows up here as
      # a dirty tree. Without this, a PR could merge with a committed header
      # describing the previous ABI and CI would stay green: the C++ driver
      # compiles against the freshly-regenerated copy in the runner's
      # checkout, never the committed one.
      - name: Committed headers are current
        run: |
          git diff --exit-code -- mfsk-ffi/include \
            || { echo "::error::include/ is stale — run 'cargo build -p mfsk-ffi' and commit"; exit 1; }

      # `cpp_compat = true` is set in both cbindgen.toml files and nothing
      # checked it. Compile each header as the only thing in a translation
      # unit, as C11 and as C++17, so a header that only works because
      # `main.cpp` happens to include something else first fails here.
      - name: Headers compile standalone (C11 + C++17)
        run: bash mfsk-ffi/tests/header_compile.sh

      - name: cargo test -p mfsk-ffi (Rust-level ABI tests)
        env:
          RUN_FST4_ROUNDTRIP: "1"
        run: cargo test -p mfsk-ffi --release

      - name: Run C++ driver (default + multi-thread tests)
        run: bash mfsk-ffi/examples/cpp_smoke/build.sh

      - name: Run C++ driver (including gated FST4 roundtrip)
        env:
          RUN_FST4_ROUNDTRIP: "1"
        run: |
          cd mfsk-ffi/examples/cpp_smoke
          ./cpp_smoke

      # The mobile build is the one that drops rayon, and rayon is not
      # referenced from this crate's own source — so nothing here would
      # notice it breaking except a build that actually selects it.
      - name: "Build + test mfsk-ffi (mobile — no rayon, no serde)"
        run: |
          cargo build -p mfsk-ffi --release --no-default-features --features mobile
          cargo test  -p mfsk-ffi --release --no-default-features --features mobile

  # ───────────────────────────────────────────────────────────────
  # rustdoc: catches broken intra-doc links and missing-example
  # compile failures. The --no-deps limits doc generation to our
  # own crate (not the full dep tree).
  # ───────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────
  # Cross-compilation: the C ABI claims Windows / Android / iOS
  # equivalence, and until this job existed the repo contained zero
  # occurrences of any of those target triples. The Rust itself is
  # portable — no file or syscall access on the decode path — so these
  # are build checks, not a port, and they are cheap enough to run on
  # every PR that touches source.
  #
  # iOS is deliberately absent: it needs a macOS runner, and the plan
  # puts it at tag time. The risk that buys is a break landing on main
  # and being found at release; it is mitigated by iOS being a pure
  # cross-compile of code Linux and Android already exercise here.
  # ───────────────────────────────────────────────────────────────
  cross:
    name: Cross-compile (windows-gnu, android)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install the MinGW linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build for Windows (GNU)
        run: cargo build -p mfsk-ffi --release --target x86_64-pc-windows-gnu

      # `MFSK_API` exists so a Windows DLL exports something. Check the
      # import library actually carries the symbols rather than trusting
      # the macro to have been emitted in the right place.
      - name: Windows DLL exports the ABI
        run: |
          set -euo pipefail
          DLL=target/x86_64-pc-windows-gnu/release/mfsk.dll
          test -f "$DLL" || { echo "::error::no DLL produced"; exit 1; }
          for sym in mfsk_abi_version mfsk_session_open mfsk_session_decode_i16 \
                     mfsk_mode_count mfsk_pack77 mfsk_stream_open; do
            x86_64-w64-mingw32-nm -g --defined-only "$DLL" | grep -q " $sym\$" \
              || { echo "::error::$sym is not exported from the DLL"; exit 1; }
          done
          echo "all checked symbols exported"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # `.cargo/config.toml` sets the 16 KB page flag, but the global
      # `RUSTFLAGS: -D warnings` at the top of this workflow **overrides**
      # `target.*.rustflags` — cargo takes the environment over the
      # config file, it does not merge them. So the flag has to be
      # repeated here, and the assertion below is what catches it going
      # missing again.
      - name: Build for Android (arm64)
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -o /tmp/jniLibs build -p mfsk-ffi --release \
            --no-default-features --features mobile

      # Android 15 ships devices with a 16 KB kernel page size, and an
      # `.so` linked for 4 KB does not load there — surfacing as a
      # silent `UnsatisfiedLinkError` on exactly the newest hardware.
      # Assert the alignment rather than assume the flag survived.
      - name: The Android .so is 16 KB aligned
        run: |
          set -euo pipefail
          SO=$(find /tmp/jniLibs -name 'libmfsk.so' | head -1)
          test -n "$SO" || { echo "::error::no .so produced"; exit 1; }
          ALIGN=$(readelf -lW "$SO" | awk '$1 == "LOAD" { print $NF; exit }')
          echo "first LOAD alignment: $ALIGN"
          [ "$ALIGN" = "0x4000" ] \
            || { echo "::error::expected 0x4000 (16 KB), got $ALIGN — the link flag was dropped"; exit 1; }

      # The `mobile` feature drops rayon, which is the reason it exists.
      - name: The mobile build really has no rayon
        run: |
          set -euo pipefail
          cargo tree -p mfsk-ffi --no-default-features --features mobile -e normal \
            | grep -q rayon \
            && { echo "::error::the mobile feature still pulls rayon"; exit 1; }
          echo "no rayon in the mobile dependency tree"

  # ───────────────────────────────────────────────────────────────
  # The Kotlin binding, built and run on a desktop JVM.
  #
  # Per-PR, and it costs no wall clock: measured at ~70 s against the
  # ~5 min `Test (tier A+B)` job that gates every run anyway. This was
  # briefly moved to release time on the belief that it was slow; the
  # 72-minute first run turned out to be a hang, not a cost (see
  # `bindings/kotlin/native/mfsk_jni.c` on `AttachCurrentThreadAsDaemon`),
  # and the measurement put it back.
  #
  # What it catches that no Rust test can: the binding is thin, so the
  # risk is **marshalling**, not decoding. A JNI signature that
  # disagrees with the Kotlin declaration fails at run time with
  # `UnsatisfiedLinkError` rather than at compile time, and a field read
  # in the wrong order produces plausible garbage. So the test
  # round-trips real audio and checks the values.
  #
  # The shim is C and `#include`s the generated header, which makes this
  # another compiler reading `mfsk.h` as a real translation unit. That
  # has already earned its keep: writing it found
  # `MFSK_DECODE_FLAG_HASH_RESOLVED` missing from the header, because it
  # lived in a dependency cbindgen cannot emit constants from — and the
  # C++ driver had missed it, never reading `flags`.
  #
  # Android is built by the `cross` job; this is the behavioural half,
  # and a desktop JVM is the only place it can run per-PR.
  # ───────────────────────────────────────────────────────────────
  kotlin:
    name: Kotlin binding (JVM)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install kotlinc
        run: |
          set -euo pipefail
          VER=2.0.21
          curl -fsSL -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v$VER/kotlin-compiler-$VER.zip"
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # Every stage inside is wrapped in `timeout` and announces itself,
      # so a hang fails with a message naming the stage instead of
      # stalling with nothing to diagnose from.
      - name: Build the binding and run the JVM test
        run: bash bindings/kotlin/build.sh

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs (features = full)
        run: cargo doc -p mfsk-core --features full --no-deps

      # The FFI crates were outside this job until 2026-09-13 and a
      # broken intra-doc link reached main through the gap. Their doc
      # comments are also what cbindgen copies into the committed C
      # headers, so a bad link there is wrong in two places at once.
      - name: "Build docs (FFI crates)"
        run: cargo doc -p mfsk-ffi -p mfsk-ffi-abi --no-deps

  # ───────────────────────────────────────────────────────────────
  # MSRV gate. `[workspace.package] rust-version` is a claim about
  # what the source needs, and without this job it is only ever
  # exercised by whatever `@stable` happens to be — i.e. never
  # falsified until a downstream user on an older toolchain hits it.
  #
  # The number moved from unset (host) / a stale 1.82 (embedded) to a
  # measured 1.93 on 2026-09-07: 1.85 fails on let-chains, 1.88 on
  # `wspr::instrument`'s `const ALL: &[&AtomicU32]` (const items could
  # not reference mutable statics until 1.93). Raising it is a
  # decision, so this job exists to make it a *deliberate* one rather
  # than something that drifts in unnoticed.
  #
  # `check`, not `test`: this asks whether the crate compiles on the
  # declared floor. Its behaviour is the tier A+B job's business, and
  # running the suite twice buys nothing.
  # ───────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned to the declared MSRV)
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--all-targets` so tests/benches count too — they are part of
      # what a contributor on the floor version has to be able to
      # build, and `internal-testing` is what keeps `--all-targets`
      # from failing on `pub(crate)` diagnostics (see the lint job).
      - name: cargo check (workspace, features = full)
        run: cargo check --workspace --all-targets --features full,internal-testing

  # ───────────────────────────────────────────────────────────────
  # cargo publish dry-run: catches crates.io-specific issues
  # (missing metadata, path deps without version, oversized
  # tarball) before the real publish workflow tries to upload.
  # ───────────────────────────────────────────────────────────────
  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Dry run (--features full)
        # Run the dry-run with every protocol feature enabled so a
        # feature-gated module that fails to compile in isolation
        # still trips this gate before the real publish step.
        run: cargo publish -p mfsk-core --features full --dry-run
