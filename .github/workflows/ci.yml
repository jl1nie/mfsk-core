name: CI

on:
  push:
    branches: [main]
    # `embedded-poc/**` are stand-alone xtensa / cortex-m binary
    # crates with their own toolchains. Excluded from the host
    # workspace and not built by host CI; skip the workflow if the
    # only changes are inside that tree.
    paths-ignore:
      - 'embedded-poc/**'
  pull_request:
    paths-ignore:
      - 'embedded-poc/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Opt every JS-based action into the Node.js 24 runtime ahead of
  # GitHub's 2026-09-16 deprecation of Node 20. Lets us keep the
  # actions pinned at @v4 / @v2 / @v1.5 without chasing individual
  # release bumps; the action authors will republish Node-24-native
  # versions over time and this env var becomes a no-op.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel in-flight runs on the same ref when a new commit arrives
# (typical case: a PR force-push or a fast-follow `--amend`). The
# group key uses `head_ref` for `pull_request` events (the source
# branch) and falls back to `ref` for `push` events on `main`. This
# does NOT dedupe the PR-vs-post-merge pair (different refs), but it
# does prevent run pile-ups on rapid PR iterations.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # Path-filter pre-pass — works out which slow-sweep matrix entries
  # in `test:` actually need to run on this PR. Sweeps are decoder
  # characterisation tests (SNR sensitivity curves, real-QSO recall
  # regression) and only catch regressions when source under the
  # protocol's own tree (or the shared core / fec / msg / lib /
  # Cargo.toml / build.rs / CI yaml itself) actually changes.
  #
  # Pre-this-filter every PR ran every sweep — the 6-PR ε refactor
  # burned ~30 min of CI on sweeps that couldn't possibly have
  # regressed because not one byte under decoder src had moved.
  #
  # Behaviour:
  #   - `push` to main: ALL sweeps run unconditionally
  #     (post-merge regression safety net).
  #   - `pull_request`: a sweep matrix entry runs only if its
  #     `changes` output flag is true.
  #
  # The `default` suite always runs (cross-cutting; covers every
  # protocol's non-ignored tests + lint-equivalent compile failures).
  # ───────────────────────────────────────────────────────────────
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      ft8: ${{ steps.filter.outputs.ft8 }}
      q65: ${{ steps.filter.outputs.q65 }}
      uvpacket: ${{ steps.filter.outputs.uvpacket }}
      catchall: ${{ steps.filter.outputs.catchall }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ft8:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/ft8/**'
              - 'mfsk-core/tests/ft8_*'
              - 'mfsk-core/tests/common/**'
            q65:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/q65/**'
              - 'mfsk-core/tests/q65_*'
              - 'mfsk-core/tests/common/**'
            uvpacket:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/uvpacket/**'
              - 'mfsk-core/tests/uvpacket_*'
              - 'mfsk-core/tests/common/**'
            catchall:
              - '.github/workflows/**'
              - 'mfsk-core/Cargo.toml'
              - 'mfsk-core/build.rs'
              - 'mfsk-core/src/lib.rs'
              - 'mfsk-core/src/core/**'
              - 'mfsk-core/src/fec/**'
              - 'mfsk-core/src/msg/**'
              - 'mfsk-core/src/ft4/**'
              - 'mfsk-core/src/fst4/**'
              - 'mfsk-core/src/jt9/**'
              - 'mfsk-core/src/jt65/**'
              - 'mfsk-core/src/wspr/**'
              - 'mfsk-core/src/uvpacket/**'
              - 'mfsk-core/tests/ft4_*'
              - 'mfsk-core/tests/fst4_*'
              - 'mfsk-core/tests/ldpc_min_sum*'
              - 'mfsk-core/tests/common/**'

  # ───────────────────────────────────────────────────────────────
  # Formatting + clippy lint gate. Fast fail so the heavier matrix
  # jobs don't burn runner minutes on a branch that wouldn't pass
  # the style fence anyway.
  # ───────────────────────────────────────────────────────────────
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --features full --no-deps -- -D warnings

  # ───────────────────────────────────────────────────────────────
  # Core test suite on the "full" feature set, split into parallel
  # matrix jobs to keep wall-clock CI time low. Two tiers within the
  # `#[ignore]`'d sweep buckets:
  #
  #   recall tier         — load-bearing regression protection. Runs
  #                         on every PR matching the path filter
  #                         (current ft8/catchall recall hooks:
  #                         `ft8_decode_block_real_qso`,
  #                         `ft8_reference_suite_recall`,
  #                         `fst4_wsjtx_samples`).
  #   characterization    — SNR sensitivity curves, depth/pass1 sweeps,
  #                         coarse-sync probes / concurrency stress,
  #                         and similar diagnostic-only tests. Run on
  #                         `push` to main and on PRs carrying the
  #                         `run-full-sweep` label, but skipped on
  #                         regular PRs (caught post-merge, revert if
  #                         broken). This is the wall-clock saving:
  #                         a typical ESP32-related PR touching
  #                         `mfsk-core/src/ft8/**` no longer spends
  #                         ~10 min on the characterization sweep on
  #                         every push.
  #
  # The non-ignored recall tests (qso3 apoff/apon/jtdx, all of
  # ft4/q65/uvpacket roundtrips + wsjtx_samples, protocol_invariants,
  # jt9/wspr wsjtx_samples) already run in the `default` suite — they
  # do not need a separate matrix entry.
  #
  # Behaviour gate per matrix entry:
  #   - `changes_key: always`            — always runs.
  #   - `changes_key: <name>`            — runs when paths-filter
  #                                        `<name>` is true OR on push
  #                                        to main.
  #   - `push_only: true` (+ changes_key) — runs on push to main, on
  #                                        PRs with `run-full-sweep`
  #                                        label, otherwise skipped
  #                                        (even when the filter would
  #                                        otherwise gate it in).
  #
  # Pre-this-split a regular `mfsk-core/src/ft8/**` PR ran ~10 min of
  # characterization on top of the recall floor. With this split, the
  # PR runs only the ~2 min recall tier; the characterization sweep
  # runs once post-merge.
  # ───────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.suite.name }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          # `changes_key` selects which output of the `changes` job
          # gates this suite. `always` opts out of the gate entirely
          # (the default suite runs every PR for cross-cutting
          # coverage). `push_only: true` skips on regular PRs and
          # only runs on push-to-main or when the PR carries the
          # `run-full-sweep` label.
          - name: default
            kind: default
            changes_key: always
            push_only: false
          # FT8 recall protection (real-QSO regression + WSJT-X
          # reference WAV recall across all distributed samples).
          # Cheap enough to keep on every ft8-relevant PR.
          - name: ft8 recall
            kind: ignored-integration
            globs: "ft8_decode_block_real_qso ft8_reference_suite_recall"
            changes_key: ft8
            push_only: false
          # FT8 characterization — SNR curves, depth/pass1 sweeps,
          # coarse-sync probe + concurrency stress. Push-only.
          - name: ft8 characterization
            kind: ignored-integration
            globs: "ft8_coarse_sync_concurrent ft8_decode_block_coarse_diag ft8_decode_block_depth_sweep ft8_decode_block_pass1_sweep ft8_decode_block_snr_sweep ft8_qso3_coarse_sync_probe"
            changes_key: ft8
            push_only: true
          # Q65 sweeps are all characterization (ap_list, ap_sweep,
          # fast_fading, snr_sweep). Recall protection sits in the
          # non-ignored `q65_roundtrip` / `q65_eme_submodes` /
          # `q65_wsjtx_samples` which already run in default.
          - name: q65 sweeps
            kind: ignored-integration
            globs: "q65_*"
            changes_key: q65
            push_only: true
          # uvpacket sweeps are characterization (per_modes_sweep,
          # pi4_dqpsk_eq, ssb_channel, fm_channel, ldpc_direct,
          # snr_calibration). Recall in `uvpacket_multichannel` is
          # non-ignored and covered by default.
          - name: uvpacket sweeps
            kind: ignored-integration
            globs: "uvpacket_*"
            changes_key: uvpacket
            push_only: true
          # catchall recall — FST4 WSJT-X reference WAV recall.
          - name: catchall recall
            kind: ignored-integration
            globs: "fst4_wsjtx_samples"
            changes_key: catchall
            push_only: false
          # catchall characterization — FT4 SNR/timing sweeps,
          # ldpc_min_sum AWGN sweep, lib-level #[ignore] tests
          # (jt9 demod/decode/search/softsym + uvpacket::puncture
          # AWGN sweeps), env-gated FST4 60-s roundtrip.
          - name: catchall characterization
            kind: catchall
            globs: "ft4_diag_low_snr ft4_snr_sweep ft4_timing_budget ldpc_min_sum"
            changes_key: catchall
            push_only: true
    steps:
      - uses: actions/checkout@v4

      - name: Gate (paths-filter + main-push + tier override)
        id: gate
        env:
          CHANGES_KEY: ${{ matrix.suite.changes_key }}
          PUSH_ONLY: ${{ matrix.suite.push_only }}
          EVENT_NAME: ${{ github.event_name }}
          FT8: ${{ needs.changes.outputs.ft8 }}
          Q65: ${{ needs.changes.outputs.q65 }}
          UVPACKET: ${{ needs.changes.outputs.uvpacket }}
          CATCHALL: ${{ needs.changes.outputs.catchall }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        # Two-stage gate.
        #
        # Stage 1 — should this suite run at all on this event?
        #   - `push` to main: yes (post-merge regression net).
        #   - `pull_request`: only if `PUSH_ONLY != true` OR the PR
        #     carries the `run-full-sweep` label (manual opt-in for
        #     when you want the heavy characterization sweep verified
        #     before merge — e.g. for a behavioural change you want
        #     the SNR curve on).
        #
        # Stage 2 — does this suite's paths-filter say it's relevant?
        #   - `changes_key: always`: yes, unconditionally (default
        #     suite is cross-cutting).
        #   - On push events: yes, all sweeps run (skip the filter so
        #     post-merge always sees the full picture).
        #   - Otherwise: gate on the named `changes` output.
        run: |
          set -e
          should_run=false
          tier_gate_ok=false
          if [ "$EVENT_NAME" = "push" ]; then
            tier_gate_ok=true
          elif [ "$PUSH_ONLY" != "true" ]; then
            tier_gate_ok=true
          elif echo "$PR_LABELS" | grep -q '"run-full-sweep"'; then
            tier_gate_ok=true
            echo "::notice::run-full-sweep label set — running push_only suite '${{ matrix.suite.name }}' on this PR."
          fi
          if [ "$tier_gate_ok" = "true" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              should_run=true
            elif [ "$CHANGES_KEY" = "always" ]; then
              should_run=true
            else
              case "$CHANGES_KEY" in
                ft8)      [ "$FT8" = "true" ]      && should_run=true ;;
                q65)      [ "$Q65" = "true" ]      && should_run=true ;;
                uvpacket) [ "$UVPACKET" = "true" ] && should_run=true ;;
                catchall) [ "$CATCHALL" = "true" ] && should_run=true ;;
              esac
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "false" ]; then
            if [ "$PUSH_ONLY" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::notice::Skipping push-only suite '${{ matrix.suite.name }}' on PR (add 'run-full-sweep' label to force)."
            else
              echo "::notice::Skipping suite '${{ matrix.suite.name }}' — no relevant source changes on this PR."
            fi
          fi

      - name: Install Rust (stable)
        if: steps.gate.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.gate.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build (full)
        if: steps.gate.outputs.should_run == 'true'
        run: cargo build -p mfsk-core --features full --release

      - name: Run suite
        if: steps.gate.outputs.should_run == 'true'
        env:
          SUITE_KIND: ${{ matrix.suite.kind }}
          SUITE_GLOBS: ${{ matrix.suite.globs }}
        # The `default` suite runs every non-ignored test (lib +
        # integration) across every protocol — no substring filter so
        # cargo test runs the lot. The `ignored-integration` suites
        # use multiple `--test <name>` flags to scope cargo down to
        # the integration test binaries that own the matching slow
        # sweeps, then `-- --ignored` to run *only* the #[ignore]'d
        # functions in those binaries (the non-ignored ones already
        # ran in the `default` suite — no double coverage). The
        # `catchall` suite also picks up `--lib -- --ignored` (jt9 +
        # uvpacket::puncture src-level sweeps) and the env-gated FST4
        # roundtrip.
        run: |
          set -euo pipefail
          case "$SUITE_KIND" in
            default)
              cargo test -p mfsk-core --features full --release
              ;;
            ignored-integration|catchall)
              test_args=""
              for pat in $SUITE_GLOBS; do
                for f in mfsk-core/tests/$pat.rs; do
                  [ -f "$f" ] || continue
                  test_args="$test_args --test $(basename "$f" .rs)"
                done
              done
              if [ -n "$test_args" ]; then
                cargo test -p mfsk-core --features full --release $test_args -- --ignored
              fi
              if [ "$SUITE_KIND" = "catchall" ]; then
                cargo test -p mfsk-core --features full --release --lib -- --ignored
                RUN_FST4_ROUNDTRIP=1 cargo test -p mfsk-core --features full --release synth_decode_roundtrip_cq_ja1abc
              fi
              ;;
          esac

  # ───────────────────────────────────────────────────────────────
  # Feature matrix: every single-protocol feature must compile on
  # its own (no-default-features + exactly one protocol). Catches
  # cross-feature dependencies that only show up when a particular
  # combination is disabled.
  # ───────────────────────────────────────────────────────────────
  feature-matrix:
    name: Build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""           # no features at all — foundation-only
          - "ft8"
          - "ft4"
          - "fst4"
          - "wspr"
          - "jt9"
          - "jt65"
          - "q65"
          - "uvpacket"
          - "alloc ft8"            # no_std + alloc baseline (TX-side host compile)
          - "alloc ft8 fft-extern" # no_std + alloc + caller-supplied FFT (RX preset)
          - "alloc ft8 fft-extern fixed-point" # full embedded integer pipeline
          - "full"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build -p mfsk-core --no-default-features --release
          else
            cargo build -p mfsk-core --no-default-features --features "${{ matrix.features }}" --release
          fi

  # ───────────────────────────────────────────────────────────────
  # mfsk-ffi: cdylib build + C++ driver (encode/decode for every
  # protocol + multi-threaded stress). Doesn't publish to crates.io
  # but is the real ABI that C/C++/Kotlin consumers link against,
  # so regressions here need catching.
  # ───────────────────────────────────────────────────────────────
  ffi:
    name: mfsk-ffi + C++ driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build mfsk-ffi
        run: cargo build -p mfsk-ffi --release

      - name: Run C++ driver (default + multi-thread tests)
        run: bash mfsk-ffi/examples/cpp_smoke/build.sh

      - name: Run C++ driver (including gated FST4 roundtrip)
        env:
          RUN_FST4_ROUNDTRIP: "1"
        run: |
          cd mfsk-ffi/examples/cpp_smoke
          ./cpp_smoke

  # ───────────────────────────────────────────────────────────────
  # rustdoc: catches broken intra-doc links and missing-example
  # compile failures. The --no-deps limits doc generation to our
  # own crate (not the full dep tree).
  # ───────────────────────────────────────────────────────────────
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs (features = full)
        run: cargo doc -p mfsk-core --features full --no-deps

  # ───────────────────────────────────────────────────────────────
  # cargo publish dry-run: catches crates.io-specific issues
  # (missing metadata, path deps without version, oversized
  # tarball) before the real publish workflow tries to upload.
  # ───────────────────────────────────────────────────────────────
  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Dry run (--features full)
        # Run the dry-run with every protocol feature enabled so a
        # feature-gated module that fails to compile in isolation
        # still trips this gate before the real publish step.
        run: cargo publish -p mfsk-core --features full --dry-run
