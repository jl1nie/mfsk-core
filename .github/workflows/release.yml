name: Release

# Triggered by tags of the form `v0.1.0`, `v0.1.1`, `v0.2.0`, …
# (not `v1.0.0-rc.1` unless the matcher is widened).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  CARGO_TERM_COLOR: always
  # Opt every JS-based action into the Node.js 24 runtime ahead of
  # GitHub's 2026-09-16 deprecation of Node 20. See ci.yml for the
  # rationale.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Gate 1 ─────────────────────────────────────────────────────────
  # Wait for the CI workflow that already ran on this commit (when it
  # was pushed to main) to finish, and refuse to publish if it didn't
  # pass. This is the gate that v0.5.10 was missing — the
  # feature-matrix job was red on main but the tag still went out to
  # crates.io because release.yml didn't look at CI status.
  #
  # We deliberately do NOT add a tag trigger to ci.yml — that would
  # re-run the entire matrix on every release for no new signal (the
  # SHA is identical to what main already tested). Instead we query
  # the existing run via the Checks API.
  wait-for-ci:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Poll CI workflow status for ${{ github.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.sha;
            const workflowName = 'CI';
            const intervalMs = 20_000;
            const timeoutMs = 30 * 60 * 1000;  // 30 min cap
            const start = Date.now();
            let lastReport = '';

            while (Date.now() - start < timeoutMs) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: ref,
                event: 'push',
                per_page: 100,
              });
              const ciRuns = data.workflow_runs.filter(r => r.name === workflowName);

              if (ciRuns.length === 0) {
                // No CI run yet for this SHA. Most likely the tag was
                // pushed before the main-push CI scheduler picked up
                // the commit (rare, but possible on a fast tag-after-
                // merge sequence). Keep waiting up to the timeout.
                if (lastReport !== 'none') {
                  core.info(`No '${workflowName}' run yet for ${ref}; waiting...`);
                  lastReport = 'none';
                }
              } else {
                const failed = ciRuns.filter(r =>
                  r.status === 'completed' && r.conclusion !== 'success' && r.conclusion !== 'skipped');
                if (failed.length > 0) {
                  const msg = failed.map(r => `${r.conclusion}: ${r.html_url}`).join('\n  ');
                  core.setFailed(`CI failure on ${ref}; refusing to publish:\n  ${msg}`);
                  return;
                }
                const pending = ciRuns.filter(r => r.status !== 'completed');
                if (pending.length === 0) {
                  const urls = ciRuns.map(r => r.html_url).join(', ');
                  core.info(`All ${ciRuns.length} CI run(s) succeeded on ${ref}: ${urls}`);
                  return;
                }
                const report = pending.map(r => `${r.status}: ${r.html_url}`).join(', ');
                if (report !== lastReport) {
                  core.info(`Waiting on ${pending.length} CI run(s): ${report}`);
                  lastReport = report;
                }
              }
              await new Promise(r => setTimeout(r, intervalMs));
            }
            core.setFailed(`Timed out (30 min) waiting for CI on ${ref}`);

      # The poll above only looks at *workflow-run* conclusions, and it
      # deliberately treats `skipped` as acceptable — a docs-only push
      # legitimately skips the build matrix. That tolerance is too wide
      # for the one job that carries the golden (tier-B) assertions:
      # a `Test (default)` that never ran would sail through, and this
      # crate has already shipped with those tests passing vacuously
      # (before the recordings were vendored they resolved from a
      # sibling WSJT-X checkout CI does not have, so five protocols'
      # golden tests skipped and reported success).
      #
      # So require, at job granularity, that `Test (default)` actually
      # ran and succeeded. Combined with `MFSK_REQUIRE_CORPUS=1` in
      # ci.yml — which turns a missing corpus into a failure rather
      # than a skip — a green `Test (default)` is a positive statement
      # that the tier-B assertions executed against real recordings.
      - name: Require Test (default) to have actually run
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: ref,
              event: 'push',
              per_page: 100,
            });
            const ciRuns = data.workflow_runs.filter(r => r.name === 'CI');
            if (ciRuns.length === 0) {
              core.setFailed(`No CI run for ${ref} to inspect`);
              return;
            }

            // Must track ci.yml's matrix entry name exactly — the job
            // renders as `Test (<suite.name>)`. Renaming the suite
            // without updating this string would silently disable the
            // gate, so the check below fails closed when the job is
            // absent rather than assuming it passed.
            const wanted = 'Test (tier A+B — invariants + golden)';
            let found = null;
            for (const run of ciRuns) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 },
              );
              const job = jobs.find(j => j.name === wanted);
              if (job) { found = job; break; }
            }

            if (!found) {
              core.setFailed(
                `CI on ${ref} has no '${wanted}' job. The tier-B golden ` +
                `assertions therefore did not run; refusing to publish.`);
              return;
            }
            if (found.conclusion !== 'success') {
              core.setFailed(
                `'${wanted}' concluded '${found.conclusion}' (not success) on ` +
                `${ref}: ${found.html_url}. Tier-B golden assertions did not ` +
                `pass; refusing to publish.`);
              return;
            }
            core.info(`'${wanted}' succeeded on ${ref}: ${found.html_url}`);

  # ── Gate 2 ─────────────────────────────────────────────────────────
  # Tag must be reachable from main and the version embedded in the
  # tag must match `mfsk-core/Cargo.toml`. Cheap; runs in parallel
  # with the CI wait.
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag commit ${GITHUB_SHA} is not an ancestor of origin/main; refusing to publish"
            exit 1
          fi

      # The tag version must match the workspace version in the root
      # `Cargo.toml` (`[workspace.package].version`) — `mfsk-core`,
      # and `mfsk-ffi` inherit it via
      # `version.workspace = true`, so this one field gates the
      # publishable crate (mfsk-core) and both binary-tarball crates
      # at once.
      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          if [ "$TAG" != "$V" ]; then
            echo "::error::Tag v$TAG does not match workspace version $V (Cargo.toml [workspace.package])"
            exit 1
          fi

  # ── Gate 3a-d ──────────────────────────────────────────────────────
  # Build every FFI binary BEFORE crates.io publish so a
  # cross-toolchain failure doesn't leave the release set in a
  # half-published state (the previous workflow had `release-ffi-*
  # needs: publish`, which meant a broken xtensa build came after
  # crates.io was already updated, with no rollback). Each job uploads
  # its tarball as a workflow artifact; the publish job downloads all
  # of them and attaches them to a single GitHub release.
  #
  # One crate ships binaries here: `mfsk-ffi`, the all-mode C ABI —
  # host only for now; Android arm64 deferred, see
  # `bindings/kotlin/` for the Kotlin binding and the cargo-ndk build in
  # the meantime. See `docs/reference/LIBRARY.md` §8-9.
  #
  # The esp32/esp32s3 tarballs that used to be built here came from
  # `mfsk-ffi-ft8`, which was retired: an ESP-IDF consumer had to write
  # a Rust staticlib shim anyway to supply the FFT planner symbol
  # (`embedded-poc/idf-component/README.md` said so itself), and once a
  # consumer is writing Rust, calling `mfsk_core` directly is simpler —
  # which is what all three of this repo's boards do.
  build-ffi-desktop-host:
    name: Build mfsk-ffi — linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p mfsk-ffi --release
      - name: Package
        run: |
          set -euo pipefail
          PKG=mfsk-ffi-${GITHUB_REF#refs/tags/}-linux-x86_64
          mkdir -p "$PKG"/{lib,include}
          cp target/release/libmfsk.so "$PKG"/lib/
          cp target/release/libmfsk.a  "$PKG"/lib/
          cp mfsk-ffi/include/mfsk.h "$PKG"/include/
          cp mfsk-ffi/README.md      "$PKG"/ 2>/dev/null || true
          cp mfsk-ffi/examples/cpp_smoke/main.cpp "$PKG"/
          tar -czvf "$PKG".tar.gz "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-desktop-host
          path: mfsk-ffi-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # ── Publish ───────────────────────────────────────────────────────
  # Runs only after every gate above is green: CI passed on this SHA,
  # tag verification succeeded, and the FFI binary built. Then
  # we cargo publish, create a single GitHub release, and attach the
  # FFI tarball in one shot.
  publish:
    name: Publish to crates.io + GitHub release
    runs-on: ubuntu-latest
    needs:
      [
        wait-for-ci,
        verify-tag,
        build-ffi-desktop-host,
      ]
    permissions:
      contents: write   # for creating the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Download FFI artifacts
        uses: actions/download-artifact@v4
        with:
          path: ffi-artifacts
          merge-multiple: true

      - name: Publish mfsk-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # mfsk-core is the only crate we publish to crates.io.
        # `mfsk-ffi` is `publish = false` — it is a binary deliverable
        # (the cbindgen-generated `.h` + the staticlib), distributed
        # via the GitHub release tarball attached below. Keeps the
        # crates.io index focused on the library consumers depend on.
        run: cargo publish -p mfsk-core --features full

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ffi-artifacts/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            Published to crates.io as [`mfsk-core ${{ github.ref_name }}`](https://crates.io/crates/mfsk-core).

            Release notes are auto-generated from merged PRs; see the crate's
            [CHANGELOG.md](https://github.com/jl1nie/mfsk-core/blob/main/CHANGELOG.md)
            for curated release notes.

            **Prebuilt `mfsk-ffi` binaries** (the all-mode C ABI —
            FT8, FT4, all five FST4 sub-modes, WSPR, JT9, JT65, Q65:
            linux-x86_64) are attached below — see
            [`mfsk-ffi/README.md`](https://github.com/jl1nie/mfsk-core/blob/main/mfsk-ffi/README.md)
            and the Kotlin/JNI scaffold in
            [`bindings/kotlin/`](https://github.com/jl1nie/mfsk-core/blob/main/bindings/kotlin/)
            for the integration guide.
