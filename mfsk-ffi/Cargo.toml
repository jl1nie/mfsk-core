[package]
name        = "mfsk-ffi"
version.workspace = true
edition     = "2024"
license     = "GPL-3.0-or-later"
publish     = false
description = "C ABI for mfsk-core — exposes WSJT-family (FT8/FT4/FST4/WSPR/JT9/JT65/Q65) decoders and synthesisers to C/C++/Kotlin via a cbindgen-generated mfsk.h header."

[lib]
name       = "mfsk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mfsk-core = { path = "../mfsk-core", version = "0.9", features = ["full"] }
mfsk-ffi-abi = { path = "../mfsk-ffi-abi", version = "0.9.0" }

[build-dependencies]
cbindgen = "0.29"
