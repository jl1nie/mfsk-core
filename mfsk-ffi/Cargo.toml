[package]
name        = "mfsk-ffi"
version.workspace = true
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-or-later"
publish     = false
description = "C ABI for mfsk-core — exposes WSJT-family (FT8/FT4/FST4/WSPR/JT9/JT65/Q65) decoders and synthesisers to C/C++/Kotlin via a cbindgen-generated mfsk.h header."

[lib]
name       = "mfsk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal path dependencies carry **no** `version` requirement, and
# that is deliberate. This crate is `publish = false`, so cargo never
# needs one — while a hand-written `version = "0.10"` here silently
# tracks nothing: `[workspace.package] version` is the single source of
# truth, a caret requirement keeps matching across patch bumps, and the
# mismatch only surfaces on a **minor** bump as a resolve failure
# (`failed to select a version for the requirement mfsk-core = "^0.9"`)
# on the day of a release. That happened cutting 0.10.0 on 2026-08-17,
# with pins that had sat at `0.9` since the 0.9.0 release.
#
# If this crate is ever published, cargo will demand a version on each
# path dep and say so immediately — an error at the right moment,
# rather than a stale literal nobody reads.
mfsk-core = { path = "../mfsk-core", features = ["full"] }
mfsk-ffi-abi = { path = "../mfsk-ffi-abi" }

[build-dependencies]
cbindgen = "0.29"
