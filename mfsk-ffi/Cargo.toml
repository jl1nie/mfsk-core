[package]
name        = "mfsk-ffi"
version.workspace = true
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-or-later"
publish     = false
description = "C ABI for mfsk-core — exposes WSJT-family (FT8/FT4/FST4/WSPR/JT9/JT65/Q65) decoders and synthesisers to C/C++/Kotlin via a cbindgen-generated mfsk.h header."

[lib]
name       = "mfsk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal path dependencies carry **no** `version` requirement, and
# that is deliberate. This crate is `publish = false`, so cargo never
# needs one — while a hand-written `version = "0.10"` here silently
# tracks nothing: `[workspace.package] version` is the single source of
# truth, a caret requirement keeps matching across patch bumps, and the
# mismatch only surfaces on a **minor** bump as a resolve failure
# (`failed to select a version for the requirement mfsk-core = "^0.9"`)
# on the day of a release. That happened cutting 0.10.0 on 2026-08-17,
# with pins that had sat at `0.9` since the 0.9.0 release.
#
# If this crate is ever published, cargo will demand a version on each
# path dep and say so immediately — an error at the right moment,
# rather than a stale literal nobody reads.
mfsk-core = { path = "../mfsk-core", default-features = false }
mfsk-ffi-abi = { path = "../mfsk-ffi-abi" }

# This crate had no `[features]` table at all and pinned `mfsk-core`'s
# `full`, so every consumer got std + rustfft + rayon + serde whether or
# not it wanted them, and `--no-default-features` changed nothing. That
# is a problem for exactly one class of consumer, and it is the class
# this ABI is being rebuilt for.
#
# **rayon is the reason.** The first decode lazily spawns rayon's global
# pool: `num_cpus` threads, 2 MiB stacks each, never joined. On Android
# those threads are not attached to ART; on iOS they sit outside GCD's
# QoS, compete with the audio render thread, and keep running when the
# app is backgrounded. A mobile build wants the option to say no.
#
# Dropping `parallel` also *strengthens* the `.on_result` delivery
# contract rather than weakening it — from "completion order, from a
# worker thread, possible transient duplicate" to "exactly once per
# returned result, in order" (`docs/reference/STREAMING.md` §3a vs §3b).
#
# `desktop` is the default and is byte-for-byte what this crate built
# before, so nothing changes for anyone who does not opt in.
# Only for `mfsk_runtime_configure`: a **private** pool, so decodes stop
# using rayon's global one. That pool is `num_cpus` threads with 2 MiB
# stacks, spawned lazily on first decode, never joined, unattached to
# ART on Android and outside GCD's QoS on iOS — still running after the
# app is backgrounded. There was no hook to change any of that at any
# layer.
rayon = { version = "1", optional = true }

[features]
default = ["desktop"]

# Everything this crate built before: every protocol it exposes, plus
# rayon and serde.
desktop = ["protocols", "legacy", "jtty", "parallel", "serde"]

# Same protocol coverage, single-threaded, no serde. This is the build an
# Android or iOS app wants, and the one thing it changes is the thing that
# matters there.
mobile = ["protocols", "legacy", "jtty"]

# The decoders the C surface actually names. Not individually selectable
# yet: `src/lib.rs` imports every protocol module unconditionally, so
# `--features ft8` alone does not compile. Splitting them is part of the
# ABI rewrite, where the entry points get cfg'd per protocol; until then
# this is one switch, and pretending otherwise would ship a feature
# combination nobody can build.
protocols = [
    "mfsk-core/std",
    "mfsk-core/fft-rustfft",   # `ft8::decode` et al. only exist with a backend
    "mfsk-core/ft8",
    "mfsk-core/ft4",
    "mfsk-core/fst4",
]

# Q65 / WSPR / JT9 / JT65 — the modes that are not `FrameDecodable` and so
# cannot share the decoder-handle shape. Same caveat as `protocols`: the
# source does not cfg them out yet.
legacy = ["mfsk-core/q65", "mfsk-core/wspr", "mfsk-core/jt9", "mfsk-core/jt65"]

# JTTY (WSJT-X 3.2's non-slotted keyboard mode): the `mfsk_jtty_*` receiver
# handle and `MFSK_MODE_JTTY`. The entry points are always in the header; without
# this feature they return `MFSK_STATUS_UNKNOWN_PROTOCOL`, as `mfsk_runtime_configure`
# does without `parallel`.
jtty = ["protocols", "mfsk-core/jtty"]

parallel = ["mfsk-core/parallel", "dep:rayon"]
serde    = ["mfsk-core/serde"]

[build-dependencies]
cbindgen = "0.29"
