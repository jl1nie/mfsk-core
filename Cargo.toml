[workspace]
members  = ["mfsk-core", "mfsk-ffi", "mfsk-ffi-abi", "mfsk-ffi-ft8", "hosttest/mfsk-app-shared"]
# `embedded-poc/*` are stand-alone Cargo projects targeting embedded
# MCUs (ESP32-S3, RP2350, …) with their own toolchain (`+esp` for
# Xtensa, etc). They depend on mfsk-core via a path dep but must not
# be part of the host workspace — otherwise host `cargo build` would
# try to compile them against the stable toolchain and fail.
#
# `bench/wasm` is excluded for the same reason with a different target:
# a wasm-bindgen harness for wasm32-unknown-unknown (issue #208), not
# meant to build under a normal host `cargo build`/`cargo test` — see
# bench/wasm/README.md.
exclude  = ["embedded-poc", "bench/wasm"]
resolver = "2"

# Single source of truth for the crate version. `mfsk-core`,
# `mfsk-ffi`, and `mfsk-ffi-ft8` all pull this via `version.workspace
# = true` in their own `[package]` tables, so a release bump is one
# edit here instead of three manually-synced literals (mfsk-ffi had
# drifted to a stale 0.1.0 before this was introduced — see
# CHANGELOG). `release.yml`'s tag-vs-Cargo.toml check reads this
# field directly.
[workspace.package]
version = "0.10.2"

# Minimum supported Rust version, and it is a measurement rather than a
# guess: `cargo +1.85 check -p mfsk-core --features full` fails on the
# let-chains in `engine/pipeline.rs` and `fec/ldpc/osd.rs` (stabilised
# for edition 2024 in 1.88), and `+1.88` then fails on
# `wspr::instrument`'s `const ALL: &[&AtomicU32]` with E0080 — `const`
# items were not allowed to hold references to mutable statics until
# **1.93** ("Allow `const` items that contain mutable references to
# `static`", 1.93.0, 2026-01-22). 1.93 builds the workspace clean.
#
# CI runs `dtolnay/rust-toolchain@stable`, so nothing here checks this
# number on an ongoing basis; it is a claim about what the source needs
# today, re-measured when someone reaches for a newer feature.
rust-version = "1.93"
