[package]
name        = "mfsk-app-shared-hosttest"
version.workspace = true
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-or-later"
publish     = false
description = "Runs the host-testable parts of embedded-poc/mfsk-app-shared on the host. Not a library."

[dependencies]
log = "0.4"
heapless = "0.8"
# `ui::decoded_list` draws with it; the row formatter under test lives
# in that same file and the file is compiled, never copied.
embedded-graphics = "0.8"

[dev-dependencies]
# Only for `activator_pack_tests`: every message the activator can
# emit must survive mfsk-core's packer, which is what the board hands
# it to. `mfsk-app-shared` itself has no mfsk-core dependency.
mfsk-core = { path = "../../mfsk-core", default-features = false, features = ["std", "ft8", "jtty"] }
