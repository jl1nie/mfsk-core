language = "C"
header = "/* Auto-generated by cbindgen. Do not edit. See mfsk-ffi-ft8/src/lib.rs. */"
include_guard = "MFSK_FT8_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[export]
prefix = ""
include = []

# See mfsk-ffi/cbindgen.toml for why parse_deps must be on, restricted
# to mfsk-ffi-abi: the shared ABI types (issue #205) are only
# `pub use`-re-exported here, not defined in this crate.
[parse]
parse_deps = true
include = ["mfsk-ffi-abi"]

[fn]
prefix = ""

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
