[package]
name        = "mfsk-serve"
version     = "0.1.0"
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-only"
publish     = false
description = "Sample app: a resident process that decodes and encodes through mfsk-core, one JSON request per line on stdin."

[dependencies]
mfsk-core  = { path = "../../mfsk-core", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rayon      = "1"
