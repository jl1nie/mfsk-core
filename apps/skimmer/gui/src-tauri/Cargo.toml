[package]
name         = "skimmer-gui"
version      = "0.12.0"
edition      = "2024"
rust-version = "1.93"
license      = "GPL-3.0-or-later"
publish      = false
description  = "Sample app: Tauri GUI for the SpyServer skimmer (skimmer-core)."

# Outside the host workspace (root Cargo.toml `exclude`): Tauri needs a
# webview (WebView2 on Windows, webkit2gtk on Linux) and the front end
# needs Node, neither of which host CI has. Built on Windows and macOS
# by .github/workflows/skimmer-installers.yml; see ../README.md.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = [] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tauri-plugin-dialog = "2"
skimmer-core = { path = "../../core" }

[profile.release]
opt-level = 3
