[package]
name        = "skimmer-core"
version.workspace = true
rust-version.workspace = true
edition     = "2024"
license     = "GPL-3.0-only"
publish     = false
description = "Sample app: decode FT8/FT4/WSPR/JT9/JT65/FST4/Q65 from a SpyServer through mfsk-core's IqReceiver, sharing the radio with SDR#. Shared by the skimmer CLI and the Tauri GUI."

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
# WAL, indexed statistics of every decode; the C library is compiled in so
# nothing has to be installed on the PC.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
regex = "1"
# No version requirement on the path dependency, as in mfsk-ffi: this
# crate is `publish = false` and the workspace version is the only truth.
mfsk-core = { path = "../../../mfsk-core", default-features = false, features = [
    "std", "parallel", "fft-rustfft",
    "ft8", "ft4", "fst4", "wspr", "jt9", "jt65", "q65",
] }

[dev-dependencies]
serde_json = "1"
