[package]
name = "embedded-shared"
version = "0.1.0"
edition = "2021"
authors = ["Minoru Tomobe <minoru.tomobe@gmail.com>"]
rust-version = "1.82"

# Shared library for `embedded-poc/m5stack-{core2,s3}` (LX6 / LX7).
# Holds the FT8-RX glue that's identical across both chips:
#
#   * `wav_sim`        — baked-WAV feed task
#   * `esp_dsp_fft`    — FftPlanner16 backed by espressif/esp-dsp
#   * `dual_core`      — APP_CPU worker for Pass 2 / Stage 3 split
#   * `stage1_inc`     — Phase E incremental stage-1 spectrogram
#   * `internal_pool`  — `.bss`-resident scratch buffers (cs staging)
#
# Excluded from the host workspace via `embedded-poc` exclusion.
# Compiled per-target against the +esp toolchain by the binary
# crates that depend on it.

[lib]
name = "embedded_shared"

[features]
# Enable LX7 PIE _aes3_ esp-dsp kernels (fc32 + sc16 radix-2 FFT).
# Default-off so LX6 (Core2, xtensa-esp32-espidf) keeps the _ae32_ path.
# Enabled by m5stack-s3 and m5stack-s3-app via features = ["aes3"].
aes3 = []

# `apps::wspr_bench` — the issue #260 Phase 1/2 candidate-loop
# measurement. Off by default: only `m5stack-s3` (LX7) enables it, and
# it is the only consumer that also brings `mfsk-core/std`, which
# `wspr::osd`'s `OnceLock` needs. See
# `docs/notes/WSPR_EMBEDDED_MEASUREMENT_PLAN.md` "Build feasibility".
# `mfsk-core/wspr-pass2-topn`: the pass-2 candidate-ladder truncation
# is embedded-only (host stays wsprd-faithful, see that feature's own
# doc comment in `mfsk-core/Cargo.toml`) — this is the one place it's
# turned on for real, not just for host differential testing.
wspr-bench = ["mfsk-core/wspr", "mfsk-core/std", "mfsk-core/wspr-pass2-topn", "mfsk-core/wspr-fano-cap-fast", "mfsk-core/wspr-ddc"]

# `apps::fst4_bench` — the issue #306 embedded-feasibility measurement:
# does the FST4-60 decoder (candidate search + LLR/BP/OSD, fed a
# host-baked FFT cache — see that module's doc comment for why the
# wideband stage can't run on-device) fit inside the ~7 s post-slot
# margin. No `mfsk-core/std` needed, unlike `wspr-bench` above: FST4
# routes entirely through the same FFT-backend-agnostic
# `engine::pipeline` FT8/WSPR already use on embedded (`fst4`'s own
# Cargo feature stopped forcing `fft-rustfft`/`std` as part of this
# same issue — see that feature's doc comment in
# `mfsk-core/Cargo.toml`). `mfsk-core/internal-testing` is needed
# because `engine::pipeline::decode_frame`'s `precomputed_fft`
# parameter — the seam this bench depends on — is only `pub` under
# that feature (issue #203's visibility escape hatch).
fst4-bench = ["mfsk-core/fst4", "mfsk-core/internal-testing"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }

mfsk-core = { path = "../../mfsk-core", default-features = false, features = ["alloc", "ft8", "fft-extern", "fixed-point", "profile-coarse", "nstep-half"] }
# `wav_sim::spawn` takes `*mut mfsk_ft8::MfskFt8Stream` from the bin.
mfsk-ffi-ft8 = { path = "../../mfsk-ffi-ft8", default-features = false, features = ["embedded-fixed-point"] }
num-complex = { version = "0.4", default-features = false }
