# m5stack-s3-app build-time configuration template.
#
# Copy this file to `cfg.toml` (gitignored — never commit) and fill in
# real credentials for your dev environment. `build.rs` reads cfg.toml
# at compile time and injects values via `cargo:rustc-env=`, so any
# change requires a rebuild.
#
# Field absence falls back to: empty SSID (= WiFi init skipped),
# 255.255.255.255:9999 broadcast for UDP log target.

[wifi]
# Home / dev WiFi SSID. Leave the entire [wifi] section out (or set
# `ssid = ""`) to disable WiFi entirely — the binary still boots, but
# UDP log is unavailable and only USB-CDC + LCD sinks are active.
ssid = "your-ssid-here"
psk = "your-passphrase-here"

# Where to send UDP log datagrams.
# - "auto" (default) → directed subnet broadcast computed from DHCP
#   (e.g. ip=192.168.1.42/24 → 192.168.1.255). More reliable than
#   limited broadcast since routers/APs often drop 255.255.255.255 for
#   power-save reasons but pass directed-broadcast through.
# - "255.255.255.255" → limited broadcast (works on simple LANs).
# - "192.168.x.y"     → unicast to a specific PC (most reliable; PC
#   IP must be stable).
pc_ip = "auto"
port = 9999
