[package]
name = "mfsk-core-m5stack-s3-app"
version = "0.1.0"
authors = ["Minoru Tomobe <minoru.tomobe@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

# M5StickS3 (ESP32-S3, LX7) で動く IC-705 FT8 コントローラ本体。
# 兄弟クレート `m5stack-s3` (compute bench) とは独立に動かす。
# 共通ロジックは `embedded-shared` (streaming wrapper / esp_dsp_fft /
# dual_core dispatch / Q3i8 LLR) を path dep で共有。

[[bin]]
name = "mfsk-core-m5stack-s3-app"
harness = false

[profile.release]
# 兄弟クレートと同じ理由で opt-level=1 (LX7 LLVM の f32-select regression
# 回避 + ELF debug 容易性)。後で "s" を試す価値はある。
opt-level = 1

[profile.dev]
debug = true
opt-level = 1

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal = "0.46"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = "0.7"
embassy-futures = "0.1"
heapless = "0.8"
num-complex = { version = "0.4", default-features = false }

# mfsk-core / FFI: 兄弟クレートと同じ feature 構成。
mfsk-core = { path = "../../mfsk-core", default-features = false, features = ["alloc", "std", "ft8", "fft-extern", "fixed-point", "profile-coarse", "nstep-half"] }
mfsk-ffi-ft8 = { path = "../../mfsk-ffi-ft8", default-features = false, features = ["embedded-fixed-point"] }

# 共有 embedded glue (streaming buffer / esp_dsp_fft / dual_core / Q3i8 LLR)
embedded-shared = { path = "../embedded-shared", features = ["aes3"] }

# Board-agnostic app logic (QSO FSM, time sync, TX picker, SNR norm,
# NVS boot mode, log fanout, WiFi + UDP, UI data + draw routines).
# Issue #61: this crate is shared with the future `m5stack-core2-app`
# variant so the only differences live in this bin's HW drivers.
mfsk-app-shared = { path = "../mfsk-app-shared" }

# UI 描画。Slint / LVGL は依存サイズと整数性能の点で見送り。
embedded-graphics = "0.8"
mipidsi = "0.8"
display-interface-spi = "0.5"

# BLE central for IC-705 CI-V (Phase 2-Stick, 2026-05-17 wire-up).
# esp32-nimble 0.12 supports BLE central + write-without-response +
# notification subscriptions (ble_client.rs upstream example). Pairs
# with the sdkconfig BLE block (CONFIG_BT_NIMBLE_ROLE_CENTRAL=y).
esp32-nimble = "0.12"

[build-dependencies]
embuild = "0.33"
# Phase 0.6: parse `cfg.toml` (WiFi credentials + UDP log target) at
# build time. Gitignored — see `cfg-sample.toml`.
toml = "0.8"

# sdkconfig.gen.defaults は build.rs が CARGO_MANIFEST_DIR 絶対パスで
# CONFIG_PARTITION_TABLE_CUSTOM_FILENAME を吐く動的ファイル (gitignored)。
# 初回ビルド前に bootstrap-sdkconfig.sh を一度実行する必要がある
# (cargo の build-script 順序上、esp-idf-sys が我々の build.rs より
# 先に走るため自動 chicken-and-egg 解決ができない)。
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "sdkconfig.gen.defaults"]

# esp-dsp は decode 経路 (`embedded_shared::esp_dsp_fft`) が前提とする。
# 兄弟クレートと同じ component 取り込み。bindings_header は per-component
# に分割済 — 共有 bindings.h を 2 つの extra_components が指していた頃は
# `esp_dsp` / `uac` 両 module に同じ symbol 一式が生えてしまっていた
# (PR #91 Gemini review 指摘)。
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-dsp", version = "^1.4" }
bindings_header = "../bindings_dsp.h"
bindings_module = "esp_dsp"

# Phase 1: UAC host capture from IC-705. 1.4.0 で ESP32-S3 + PSRAM 構成
# 対応 + driver task の任意コア配置が確定 (旧版は PSRAM 有効時に driver
# task stack が壊れる既知問題があった)。bindings_module = "uac" で
# `esp_idf_sys::uac::*` に `uac_host_install` / `uac_host_device_open` /
# `uac_host_device_start` / `uac_host_device_read` などが生える。
# reference example は esp-usb 上流の
# `host/class/uac/usb_host_uac/examples/audio_player/main/main.c`。
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_uac", version = "^1.4" }
bindings_header = "../bindings_uac.h"
bindings_module = "uac"
