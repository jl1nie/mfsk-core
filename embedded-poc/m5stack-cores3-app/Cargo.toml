[package]
name = "mfsk-core-m5stack-cores3-app"
version = "0.1.0"
authors = ["Minoru Tomobe <minoru.tomobe@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

# M5Stack CoreS3 (ESP32-S3, LX7) FT8 controller — main UAC target.
# Phase B-Core from docs/notes/ROADMAP.md. Shares `mfsk-app-shared` and
# `embedded-shared` with both sibling app crates. Board-specific layer:
# AXP2101 + AW9523B PMIC/IO-expander, ILI9342C LCD, FT6336U touch (Phase
# 6-Core), ES7210 mic + AW88298 speaker (Phase 3-Core), USB-OTG host for
# IC-705 UAC (Phase 1-Core), BLE CI-V to IC-705 (Phase 2-Core).

[[bin]]
name = "mfsk-core-m5stack-cores3-app"
harness = false

# WSPR candidate-loop bench — issue #260 Phase 1/2, see
# `docs/notes/WSPR_EMBEDDED_MEASUREMENT_PLAN.md`. Lives here rather than
# in the `m5stack-s3` bench crate only because the bench hardware is a
# CoreS3 and `m5stack-s3`'s sdkconfig pins Octal PSRAM; see the bin's
# own doc comment.
[[bin]]
name = "wspr-bench"
path = "src/bin/wspr_bench.rs"
harness = false

# WSPR receiver app (CoreS3 WSPR app plan, steps 1-8) — the actual UI
# built on top of the WSPR embedded RX work above. See
# `docs/notes/ROADMAP.md` Phase E and this crate's own CLAUDE.md.
[[bin]]
name = "wspr-app"
path = "src/bin/wspr_app.rs"
harness = false

# FST4-60 decoder-only bench — issue #306, embedded feasibility
# question. Separate track from the WSPR bench above: does the FST4
# decoder (candidate search + LLR/BP/OSD, fed a host-baked FFT cache)
# fit the ~7 s post-slot margin. See
# `embedded-shared::apps::fst4_bench`'s module doc comment.
[[bin]]
name = "fst4-bench"
path = "src/bin/fst4_bench.rs"
harness = false

# FST4-60 DDC-fed coarse-sync + refine + decode bench —
# docs/notes/FST4_DDC_DESIGN.md stage 5's first half. The whole chain
# (DDC -> coarse_sync -> refine -> LLR/BP/OSD) on real audio, not just
# the decoder half `fst4-bench` above measures. See
# `embedded-shared::apps::fst4_ddc_bench`'s module doc comment.
[[bin]]
name = "fst4-ddc-bench"
path = "src/bin/fst4_ddc_bench.rs"
harness = false

# LlrScalar (f32 vs Q11i16 vs Q3i8) microbenchmark — issue #198's
# deprioritized `FecCodec::decode_soft` genericization premise, checked
# cheaply before committing to that work. See
# `embedded-shared::apps::scalar_bench`'s module doc comment.
[[bin]]
name = "scalar-bench"
path = "src/bin/scalar_bench.rs"
harness = false

# Minimal LCD-only bring-up test — diagnostic for the 2026-08-15
# "nothing shows on the CoreS3 screen" investigation. See its own doc
# comment.
[[bin]]
name = "lcd-minimal"
path = "src/bin/lcd_minimal.rs"
harness = false

# WiFi-only diagnostic — repeated connect/disconnect cycles against
# the AP, verbose lwIP DHCP trace, no scan/DDC/display tasks at all.
# Same rationale as `lcd-minimal`: isolate the thing under
# investigation (WiFi flakiness against this AP, see wspr-app's own
# design memory) from wspr-app's own confounds (scan_loop's
# decode-time internal-DRAM churn, task competition). See its own doc
# comment.
[[bin]]
name = "wifi-probe"
path = "src/bin/wifi_probe.rs"
harness = false

[profile.release]
# **Changed 2026-08-13, verified on hardware** — issue #260. Was `1`,
# on this comment:
#
#   "Same LX7 LLVM regression workaround as sibling crates: opt-level=1
#    avoids the f32-select code-gen bug in `mfsk-core::core::pipeline`."
#
# Tracing that to its source (`embedded-poc/m5stack-s3/Cargo.toml`) said
# something different: the regression is at opt-level **"s"/"z"**, not
# at 2/3; the arithmetic-form workaround already in `core::pipeline`
# "dodges the trigger"; and the actual reason given for staying low was
# that it "keeps the ELF debuggable". The paraphrase above had dropped
# both qualifiers and turned a debuggability preference into a
# correctness requirement.
#
# Measured on the S3 WSPR candidate-loop bench (`wspr-bench`,
# `docs/notes/WSPR_EMBEDDED_MEASUREMENT_RESULTS.md`), which reports
# per-stage wall-clock *and* a 9/9 golden-decode check that would have
# caught the f32-select bug if it were real on this path:
#
#   one decode_scan, 240 MHz / 80 MHz PSRAM, opt-level=1: 1 214.3 s
#   same, opt-level=3:                                    1 024.6 s  (1.19x)
#   both: 9/9 golden decodes, decode-for-decode identical
#
# So on this path the bug does not fire and `3` is a clean win. That
# does not generalise to the DSP pipeline `core::pipeline` actually
# warns about — FT8's f32-select code lives in the sibling crates,
# which are deliberately untouched here (changing them invalidates the
# published timings in `docs/notes/BENCHMARKS.md`/`ROADMAP.md` and is a
# re-measurement + correctness-check job of its own).
opt-level = 3

[profile.dev]
debug = true
opt-level = 1

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal = "0.46"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = "0.7"
heapless = "0.8"
num-complex = { version = "0.4", default-features = false }

# mfsk-core / FFI: same feature set as the sibling app + bench crates.
# `fst4`/`internal-testing`: issue #306's decoder-only bench
# (`fst4-bench` bin) — see `embedded-shared`'s `fst4-bench` feature
# doc comment for why `fst4` no longer needs `fft-rustfft`/`std` and
# why `internal-testing` is required regardless (it gates
# `decode_frame`'s `precomputed_fft` parameter, the seam that bench
# depends on). Crate-wide like `wspr-bench`'s features below, not
# scoped to just the `fst4-bench` bin — Cargo has no per-bin feature
# sets within one crate.
mfsk-core = { path = "../../mfsk-core", default-features = false, features = ["alloc", "std", "ft8", "fst4", "fft-extern", "fixed-point", "profile-coarse", "nstep-half", "internal-testing"] }
mfsk-ffi-ft8 = { path = "../../mfsk-ffi-ft8", default-features = false, features = ["embedded-fixed-point"] }

# Shared decode-pipeline layer (streaming, dual_core, stage1_inc, esp_dsp_fft).
embedded-shared = { path = "../embedded-shared", features = ["aes3", "wspr-bench", "fst4-bench"] }

# Board-agnostic app logic (QSO FSM, time sync, TX picker, SNR norm,
# NVS boot mode, log fanout, WiFi + UDP, UI draw routines).
# CoreS3 has native USB-JTAG (same as StickS3) so enable usb-serial-jtag
# feature (FanoutLogger gates println! on usb_serial_jtag_is_connected).
# Phase 1-Core: when UAC host is active, USB-JTAG is consumed — add a
# runtime guard then rather than disabling the feature here.
mfsk-app-shared = { path = "../mfsk-app-shared" }

# UI rendering — same as sibling crates.
embedded-graphics = "0.8"
mipidsi = "0.8"
display-interface-spi = "0.5"

[build-dependencies]
embuild = "0.33"
toml = "0.8"

# build.rs writes sdkconfig.gen.defaults with the absolute partition CSV
# path. Run `./bootstrap-sdkconfig.sh` once on a fresh clone.
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "sdkconfig.gen.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-dsp", version = "^1.4" }
bindings_header = "../bindings_dsp.h"
bindings_module = "esp_dsp"

# Phase 1-Core: UAC host capture from IC-705. Same version + bindings
# split as s3-app (PR #91 rationale: separate bindings_module avoids
# symbol collision with esp_dsp symbols in the same sys module).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_uac", version = "^1.4" }
bindings_header = "../bindings_uac.h"
bindings_module = "uac"
