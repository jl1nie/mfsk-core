[package]
name = "mfsk-core-m5stack-s3"
version = "0.1.0"
authors = ["Minoru Tomobe <minoru.tomobe@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

# m5stack-core2 (LX6) クレートからの複製 — issue #15 Phase 2 baseline。
# m5stack-core2/ は一切変更しない方針。共通切り出しは Phase 3-5 で
# 重複が顕在化したら検討する (前倒ししない)。

[[bin]]
name = "mfsk-core-m5stack-s3"
harness = false # disable cargo's built-in test harness

# WAV-fed streaming RX bench. Validates the stream wrapper +
# dual-core decode pipeline end-to-end without needing a real I2S
# PDM mic — the `wav_sim` task pumps baked QSO WAVs into the ring
# buffer at 1× real time. Build:
#   cargo build --release --bin rx-wavsim
[[bin]]
name = "rx-wavsim"
path = "src/bin/rx_wavsim.rs"
harness = false

# WSPR candidate-loop bench — issue #260 Phase 1/2, see
# `docs/notes/WSPR_EMBEDDED_MEASUREMENT_PLAN.md`. Fed a host-baked
# 375 Hz baseband so no streaming DDC has to exist first. Build:
#   cargo build --release --bin wspr-bench
[[bin]]
name = "wspr-bench"
path = "src/bin/wspr_bench.rs"
harness = false

[profile.release]
# `opt-level = 1` mirrors the ESP32-S3 PoC: same Xtensa-Rust LLVM
# regression at opt-level "s"/"z" with f32-select patterns. The
# arithmetic-form workaround in `mfsk-core::core::pipeline` (FT4 SIC)
# dodges the trigger but keeping opt-level low keeps the ELF debuggable.
opt-level = 1

[profile.dev]
debug = true
opt-level = 1

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

# Sibling crate. Excluded from the host workspace (`/Cargo.toml`
# `exclude = ["embedded-poc"]`) so host `cargo build` only touches
# mfsk-core / mfsk-ffi against the stable toolchain. `fft-extern`
# routes `default_planner()` to the binary-supplied `EspDspPlanner`
# (see `src/esp_dsp_fft.rs`); the `embedded-rx` preset bundles the
# alloc/no-rustfft/no-rayon flags. `ft8` only — FT4/WSPR/Q65 deferred
# until decode timing is confirmed.
mfsk-core = { path = "../../mfsk-core", default-features = false, features = ["alloc", "std", "ft8", "fft-extern", "fixed-point", "profile-coarse", "nstep-half"] }
# C ABI surface — exercised by the FFI smoke call in `decode_one`
# (see `MFSK_FFI_FT8_SMOKE` env-style toggle in `main.rs`). Same
# `mfsk_core_*` extern symbols (FFT planner, dot_q15) supplied by
# `esp_dsp_fft.rs` resolve both the direct-Rust and the via-FFI path
# without duplication.
mfsk-ffi-ft8 = { path = "../../mfsk-ffi-ft8", default-features = false, features = ["embedded-fixed-point"] }
num-complex = { version = "0.4", default-features = false }

# Shared embedded glue (wav_sim / esp_dsp_fft / dual_core / stage1_inc /
# internal_pool). Compiled per-target alongside this binary.
embedded-shared = { path = "../embedded-shared", features = ["aes3", "wspr-bench"] }

[build-dependencies]
embuild = "0.33"

# sdkconfig.gen.defaults は build.rs が CARGO_MANIFEST_DIR 絶対パスで
# CONFIG_PARTITION_TABLE_CUSTOM_FILENAME を吐く動的ファイル (gitignored)。
# 初回ビルド前に bootstrap-sdkconfig.sh を一度実行する必要がある
# (cargo の build-script 順序上、esp-idf-sys が我々の build.rs より
# 先に走るため自動 chicken-and-egg 解決ができない)。
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "sdkconfig.gen.defaults"]

# Pull in esp-dsp (Espressif managed component) for the FFT routines
# referenced by `src/esp_dsp_fft.rs`. Same configuration as the
# ESP32-S3 PoC — `dsps_fft2r_fc32_ae32_` exists on both LX6 (ESP32)
# and LX7 (S3).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-dsp", version = "^1.4" }
bindings_header = "../bindings_dsp.h"
bindings_module = "esp_dsp"
